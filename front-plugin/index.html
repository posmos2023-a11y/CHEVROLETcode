<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://static.toss.im/tds/43.9.4/css/tds.min.css" />
    <link rel="stylesheet" type="text/css" href="https://static.toss.im/tps/main.css" />
    <link rel="stylesheet" type="text/css" href="https://static.toss.im/tps/others.css" />
    <script src="https://cdn.tossplace.com/toss-front-sdk/v0/index.js"></script>
    <script src="./sdk.js"></script>
    <script src="./api-config.js"></script>
    <script src="./erp-front-pay.js"></script>
    <title>쉐보레 예약/결제 - Toss Front Plugin</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // 대기화면. 아래 두 버튼(예약/결제)과 별개로, 매장 토큰이 설정돼 있으면 전산이 이 프론트로
      // 보낸 정비 주문이 있는지 몇 초마다 확인해서, 있으면 결제 화면(erp-pay.html)으로 넘어간다.
      const ERP_POLL_MS = 3000
      const ERP_RECOVER_TIMEOUT_MS = 15000 // 지난 결제 복구 한 번에 기다리는 최대 시간
      const ERP_RECOVER_RETRY_TICKS = 20 // 복구가 끝나지 않았을 때 몇 번째 폴링마다 다시 시도할지(3초 x 20 = 약 1분)
      const ERP_RETRY_MS = 10000 // 토큰이 없거나 시작에 실패했을 때 다시 보는 간격
      const ERP_TOKEN_TOAST_INTERVAL_MS = 60000 // 토큰 없음 안내를 다시 띄우는 최소 간격
      const ERP_FILTER_TIMEOUT_MS = 12000 // 결제할 주문 거르기(저장소의 미기록 목록 읽기)를 기다리는 최대 시간

      function withTimeout(promise, ms, fallback) {
        let timer
        return Promise.race([
          Promise.resolve(promise),
          new Promise((resolve) => {
            timer = setTimeout(() => {
              console.warn('[index] 저장소 확인이 시간 안에 끝나지 않아 이번 폴링은 넘기지 않습니다.')
              resolve(fallback)
            }, ms)
          }),
        ]).finally(() => clearTimeout(timer))
      }

      // 결제창을 띄워도 되는 주문(erp-front-pay.js filterStartableCarts). 서버가 "이미 승인된 결제가 있다"(frontOrphan, 직원 확인 전)고
      // 알려 준 주문도 여기서 빠진다(다른 프론트에서 승인된 결제 포함). 미기록 목록은 저장소에서 읽는데, 저장소 작업은 한 줄로 서 있어
      // 앞의 쓰기(뒤 복구의 기록 정리 등)가 끝나지 않으면 이 읽기도 끝나지 않는다 -- 예전엔 그대로 기다려 다음 폴링을 영영 예약하지 못했다
      // (전산 결제 받기가 조용히 멈춤, 2026-10-23 점검). 시간 제한이 지나면 빈 목록(넘기지 않음)으로 본다. 앞 폴링의 확인이 아직 안
      // 끝났으면 저장소 줄에 확인을 더 쌓지 않고 이번에도 빈 목록이다(앞의 쓰기가 끝나면 다음 폴링부터 다시 확인한다).
      let cartFilterRunning = false
      function startableCarts(pay, carts) {
        if (cartFilterRunning) return Promise.resolve([])
        cartFilterRunning = true
        const filtering = Promise.resolve().then(() => pay.filterStartableCarts(carts))
        filtering.catch(() => {}).finally(() => { cartFilterRunning = false })
        return withTimeout(filtering, ERP_FILTER_TIMEOUT_MS, [])
      }

      // 토스트는 안내일 뿐이다. 거부된 Promise를 돌려주는 SDK에서도 unhandledrejection이 되지 않게 삼킨다.
      function toast(options) {
        try {
          Promise.resolve(sdk.template.openToast?.(options)).catch(() => {})
        } catch { /* 안내일 뿐 */ }
      }

      // 프론트를 초기화하면 매장 토큰이 지워지는데, 아무 안내 없이 전산 결제만 조용히 안 받아져서 직원이 원인을 한참 찾았다.
      // 대기화면은 손님 화면이라 처음 한 번만 띄우고, 그 뒤로는 토큰이 여전히 없을 때 1분에 한 번만 다시 띄운다. 토큰이 생기면
      // 이 경로를 더 타지 않으므로 다시 띄우지 않는다.
      // 지난 결제 보고가 401·403(토큰이 틀림·재발급됨, 매장 비활성)을 받았을 때도 같은 간격으로 안내한다(기록은 남아 있어 토큰을
      // 바로잡고 대기화면이 다시 열리면 복구가 다시 보고한다).
      let lastTokenToastAt = 0
      function notifyTokenProblem(message) {
        const now = Date.now()
        if (now - lastTokenToastAt < ERP_TOKEN_TOAST_INTERVAL_MS) return
        lastTokenToastAt = now
        toast({ message, icon: 'error' })
      }
      function notifyTokenMissing() {
        notifyTokenProblem('매장 토큰이 없어 전산 결제를 받을 수 없습니다. 플러그인 설정에서 매장 토큰을 넣어주세요.')
      }

      // 승인(또는 취소)은 됐는데 서버가 기록을 받지 않은 건이 아직 안내되지 않았으면 true. 직원 안내 화면은 결제 화면(erp-pay.html
      // init)이 띄우므로 다음 폴링에서 그쪽으로 넘어간다.
      let orphanNoticePending = false

      // 지난번 결제·취소가 보고 없이 끝났으면(결제 도중 재시작 등) 마무리한다. 확인이 안 끝난 건('pending'·'auth')이 하나라도 있으면
      // 'pending'. 결제와 취소를 따로 돌린다 -- 한쪽이 늦어져도 다른 쪽은 진행되게(SDK 확인 호출은 erp-front-pay.js가 10초로 자른다).
      // '알렸습니다' 토스트는 서버가 실제로 기록했을 때('paid'·'refunded')만 띄운다. 거절된 보고('orphan')는 성공이 아니다.
      async function runRecovery(pay, token) {
        const paid = pay.recoverInflight(token).then((r) => {
          if (r === 'paid') toast({ message: '지난 결제 완료를 전산에 알렸습니다.', icon: 'success' })
          return r
        })
        const refunded = pay.recoverRefundInflight(token).then((r) => {
          if (r === 'refunded') toast({ message: '지난 결제 취소 완료를 전산에 알렸습니다.', icon: 'success' })
          return r
        })
        const results = await Promise.all([paid, refunded])
        if (results.includes('auth')) notifyTokenProblem('지난 결제 결과를 전산에 알리지 못했습니다. 플러그인 설정에서 매장 토큰을 확인해주세요.')
        if (await pay.hasOrphanNotices()) orphanNoticePending = true
        return results.some((r) => r === 'pending' || r === 'auth') ? 'pending' : 'done'
      }

      async function watchErpCarts() {
        const pay = window.ErpFrontPay
        const token = await pay.getToken()
        if (!token) {
          // 예전엔 여기서 그냥 끝나서, 토큰을 나중에 넣어도 프론트를 다시 켜기 전까지 전산 결제를 못 받았다.
          notifyTokenMissing()
          setTimeout(startWatching, ERP_RETRY_MS)
          return
        }

        let stopped = false
        let ticks = 0
        let recoveryNeeded = true
        let recoveryRunning = false

        // 복구는 폴링과 별개로 뒤에서 돈다. 예전엔 복구를 await한 뒤에야 폴링이 시작돼서, 복구 중 서버가 느리거나 SDK 호출
        // (getPayment)이 끝나지 않으면 새 결제 주문을 영영 못 받았다. 15초 안에 안 끝나면 기다리기를 그만두고 '아직 안 끝남'으로
        // 두어 나중에 다시 시도한다(원래 호출은 계속 돌 수 있다 -- 겹쳐 돌아도 서버가 같은 보고를 멱등하게 받는다).
        const recoverInBackground = async () => {
          if (recoveryRunning) return
          recoveryRunning = true
          let timer
          try {
            const outcome = await Promise.race([
              runRecovery(pay, token),
              new Promise((resolve) => { timer = setTimeout(() => resolve('timeout'), ERP_RECOVER_TIMEOUT_MS) }),
            ])
            recoveryNeeded = outcome !== 'done'
          } catch (e) {
            console.error('[index] 지난 결제 복구 실패', e)
            recoveryNeeded = true
          } finally {
            clearTimeout(timer)
            recoveryRunning = false
          }
        }

        const tick = async () => {
          if (stopped) return
          ticks += 1
          // 복구가 끝나지 않은 동안(기록이 남아 있는 동안)은 20번째 폴링마다 다시 시도한다.
          if (recoveryNeeded && ticks % ERP_RECOVER_RETRY_TICKS === 0) recoverInBackground()
          // 예외(SDK·저장소 오류 등)가 setTimeout 재예약을 끊으면 폴링이 영영 멈춘다 -- 잡아서 다음 폴링을 반드시 건다.
          try {
            if (orphanNoticePending) {
              // 승인됐는데 전산이 받지 않은 건을 직원에게 알리러 결제 화면으로 넘어간다(그 화면이 안내를 띄우고 돌아온다).
              stopped = true
              location.href = './erp-pay.html'
              return
            }
            const { ok, body } = await pay.listCarts(token)
            // 쉬는 주문과, 승인됐는데 전산이 받지 않은 결제가 걸린 주문(이중결제 위험 -- 이 단말기의 미기록 목록과 서버의 frontOrphan)은
            // 결제창을 자동으로 띄우지 않는다.
            // 지난 기록 확인이 안 끝나 결제 화면이 쉬게 한 주문(holdStuck)도 넘기지 않는다 -- 예전엔 그 주문을 보자마자 결제 화면으로
            // 넘겼고, 결제 화면은 확인하지 못해 곧바로 돌려보내 두 화면을 쉬지 않고 오갔다. 쉬는 동안에도 뒤 복구(recoverInBackground)가
            // 그 기록을 계속 확인하고, 정리되면 쉬기가 풀려 다음 폴링에서 넘어간다. 다른 주문·취소는 그대로 넘긴다.
            // 저장소가 응답하지 않아도 이 폴링이 끝나 다음 폴링이 예약되게 시간 제한을 둔다(startableCarts).
            const carts = ok ? await startableCarts(pay, body.carts) : []
            // 정비 대기열에서 요청한 결제 취소도 같은 화면(erp-pay.html)에서 처리한다(쉬는 건은 같은 기준으로 뺀다).
            const refunds = ok ? pay.filterStartableRefunds(body.refunds) : []
            if (carts.length || refunds.length) {
              stopped = true
              location.href = './erp-pay.html'
              return
            }
          } catch (e) {
            console.error('[index] 전산 주문 확인 오류', e)
          }
          setTimeout(tick, ERP_POLL_MS)
        }

        // 손님이 예약/결제 버튼을 눌러 다른 화면으로 가는 순간 폴링을 멈춘다(페이지 이동으로 자연히
        // 멈추지만, 이동 중에 결제 화면으로 끼어드는 일을 확실히 막는다).
        window.addEventListener('pagehide', () => { stopped = true })

        tick()
        recoverInBackground()
      }

      // 시작에 실패해도(토큰 읽기 오류 등) 10초 뒤 다시 시도한다. 한 번 실패로 전산 결제를 영영 못 받게 두지 않는다.
      function startWatching() {
        watchErpCarts().catch((e) => {
          console.error('[index] 전산 주문 확인 실패', e)
          setTimeout(startWatching, ERP_RETRY_MS)
        })
      }

      // [결제하기](금액을 직접 넣는 payment.html)는 뺐다. 정비 결제는 전산 주문이 들어오면 위 watchErpCarts가
      // 결제 화면(erp-pay.html)으로 자동으로 넘기므로, 손님이 누를 버튼은 예약 하나면 된다.
      // 전산 주문 확인을 화면 그리기보다 **먼저** 시작한다 -- 대기화면 그리기에서 오류가 나도 결제 주문은 받아 가야 한다.
      startWatching()

      try {
        sdk.template.renderIdlePage({
          type: 'oneButton',
          description: {
            text: '쉐보레 정비 예약',
            subText: '차량번호로 예약하면 순서를 알림톡으로 알려드려요',
          },
          button: {
            text: '예약하기',
            onClick: () => {
              location.href = './reservation.html'
            },
          },
        })
      } catch (e) {
        // 이 단말기 SDK가 oneButton을 못 그리면 기본 대기화면이라도 띄운다(예약은 직원에게 안내).
        console.error('[index] 대기화면(oneButton)을 그리지 못했습니다', e)
        try { sdk.template.renderIdlePage() } catch (e2) { console.error('[index] 기본 대기화면도 실패', e2) }
      }
    </script>
  </body>
</html>
