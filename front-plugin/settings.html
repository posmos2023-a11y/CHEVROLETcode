<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://static.toss.im/tds/43.9.4/css/tds.min.css" />
    <link rel="stylesheet" type="text/css" href="https://static.toss.im/tps/main.css" />
    <link rel="stylesheet" type="text/css" href="https://static.toss.im/tps/others.css" />
    <script src="https://cdn.tossplace.com/toss-front-sdk/v0/index.js"></script>
    <script src="./sdk.js"></script>
    <script src="./api-config.js"></script>
    <script src="./erp-front-pay.js"></script>
    <title>설정 - Toss Front Plugin</title>
  </head>
  <body>
    <!--
      플러그인 설정 화면(프론트 설정 > 플러그인 선택 > 플러그인 설정).
      전산 주문을 이 프론트에서 결제하려면 매장 토큰(X-Store-Token)이 필요하다. POS 탭앱과 같은
      값이며, 관리자 웹 [매장 개통 설정] > 해당 매장 > POS 토큰 [보기]에서 확인한다.
      매장 토큰을 넣지 않은 프론트는 접수 기능만 쓴다(대기화면은 앱을 켤 때 한 번만 토큰 안내를 띄운다).
    -->
    <div id="app"></div>
    <script>
      const pay = window.ErpFrontPay

      function goHome() {
        location.href = './index.html'
      }

      async function showMenu(notice) {
        const token = await pay.getToken()
        let subtitle = '전산 주문 결제를 쓰려면 매장 토큰을 넣어주세요'
        if (token) {
          const { ok, status, body } = await pay.listCarts(token)
          subtitle = ok
            ? `연결됨: ${body.storeName || '매장'}`
            : status === 401
              ? '저장된 매장 토큰이 올바르지 않아요. 다시 넣어주세요'
              : body.error || '서버에 연결하지 못했어요\n인터넷 연결을 확인해주세요' // 연결 실패는 api()가 같은 문구를 준다
        }
        const options = [
          { title: '매장 토큰 직접 입력', onClick: () => showTokenInput() },
          { title: 'QR로 매장 토큰 입력', onClick: () => showTokenScan() },
        ]
        if (token) {
          options.push({
            title: '매장 토큰 지우기',
            onClick: async () => {
              await pay.clearToken()
              showMenu('매장 토큰을 지웠어요. 전산 주문 결제가 꺼졌어요')
            },
          })
        }
        options.push({ title: '나가기', onClick: goHome })

        sdk.template.renderSelectPage({
          title: '전산 주문 결제 설정',
          subtitle: notice ? `${notice}\n${subtitle}` : subtitle,
          options,
          onBack: goHome,
        })
      }

      function showTokenInput(errorText) {
        sdk.template.renderInputPage({
          type: 'text',
          top: {
            title: '매장 토큰을 입력해주세요',
            subtitle: errorText || '관리자 웹 [매장 개통 설정]의 POS 토큰을 넣어주세요',
          },
          input: { placeholder: '매장 토큰', type: 'password' },
          button: { label: '저장' },
          onSubmit: (value) => saveToken(value, showTokenInput),
          onBack: () => showMenu(),
        })
      }

      function showTokenScan() {
        sdk.template.renderQRScanPage({
          title: '매장 토큰 QR을 카메라에 비춰주세요',
          // QR에 값이 없을 때만 'QR을 못 읽었다'고 한다. 값은 읽었는데 서버가 거절했거나 연결이 안 되면 그 사유를 그대로 보여 준다
          // (예전엔 어떤 실패든 'QR을 못 읽었다'고 해서 직원이 엉뚱한 곳을 봤다).
          onSuccess: (data) => {
            if (!String(data?.value ?? '').trim()) {
              showMenu('QR에서 매장 토큰을 읽지 못했어요')
              return
            }
            saveToken(data.value, (reason) => showMenu(reason))
          },
          onBack: () => showMenu(),
        })
      }

      // 저장하기 전에 서버에 실제로 물어본다. 틀린 값을 저장하면 대기화면이 조용히 아무것도
      // 안 가져와서, 직원은 설정을 마쳤다고 믿는데 전산 주문이 안 뜬다.
      async function saveToken(raw, onInvalid) {
        const token = String(raw || '').trim()
        if (!token) {
          onInvalid('매장 토큰을 입력해주세요')
          return
        }
        const { ok, status, body } = await pay.listCarts(token)
        if (!ok) {
          onInvalid(status === 401 ? '매장 토큰이 올바르지 않아요' : (body.error || '서버에 연결하지 못했어요\n인터넷 연결을 확인해주세요'))
          return
        }
        await pay.setToken(token)
        sdk.template.renderResultPage({
          type: 'image',
          status: 'success',
          title: '매장 토큰을 저장했어요',
          description: `${body.storeName || '매장'}\n전산 주문을 이 단말기에서 결제해요`, // image 타입은 줄을 자동으로 바꾸지 않는다
          timerMs: 4000,
          onTimeout: goHome,
          localeCode: 'ko',
        })
      }

      showMenu()
    </script>
  </body>
</html>
