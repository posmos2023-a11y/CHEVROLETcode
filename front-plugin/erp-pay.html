<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://static.toss.im/tds/43.9.4/css/tds.min.css" />
    <link rel="stylesheet" type="text/css" href="https://static.toss.im/tps/main.css" />
    <link rel="stylesheet" type="text/css" href="https://static.toss.im/tps/others.css" />
    <script src="https://cdn.tossplace.com/toss-front-sdk/v0/index.js"></script>
    <script src="./sdk.js"></script>
    <script src="./api-config.js"></script>
    <script src="./erp-front-pay.js"></script>
    <title>정비 결제 - Toss Front Plugin</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // 전산이 이 프론트로 보낸 정비 주문을 결제한다(erp-front-pay.js 상단 주석 참고).
      // 대기화면(index.html)이 결제할 주문이 생긴 걸 보고 이 화면으로 넘어오며, 주문이 한 건이면
      // 곧바로 통합결제창(결제수단 선택)을 띄운다. 여러 건일 때만 차량을 고르는 화면을 먼저 보여준다.
      const pay = window.ErpFrontPay
      let storeName = '' // 영수증 추가 문구용(서버 목록 응답의 storeName)
      const SELECT_IDLE_MS = 60000 // 차량 선택 화면 무입력 제한

      function goHome() {
        location.href = './index.html'
      }

      // --- 흰 화면 방지 --------------------------------------------------------------
      // 이 화면은 서버 응답을 받은 뒤에야 템플릿을 그린다. 그 사이 오류가 나거나 응답이 오지 않으면 아무것도 못 그린
      // 흰 화면으로 멈춘다(손님은 프론트를 못 쓰고 직원은 이유를 모른다). 세 겹으로 막는다.
      //   1) 서버 호출 시간 제한(erp-front-pay.js api, 12초)
      //   2) 예상 못 한 오류는 안내 화면을 띄우고 대기화면으로 돌아간다(recoverFromError)
      //   3) 들어온 지 20초가 지나도 첫 화면(안내·차량 선택)도 못 그렸고 결제·취소창도 띄우지 못했으면 대기화면으로 돌아간다.
      //      첫 화면을 그리거나 결제·취소창을 띄우기 직전에 이 감시는 꺼진다(stopLoadWatchdog) -- 그 뒤로는 화면마다 자기
      //      타이머가 있고, 결제·취소창이 떠 있는 동안 끌고 나가면 안 된다.
      //      결제·취소를 시작하는 단계(startPayment·runRefund)는 감시를 다시 걸고 단계마다 새로 준다(armLoadWatchdog·preNativeStep).
      //      예전엔 시작하자마자 감시를 꺼서, 그 뒤의 저장소 쓰기가 끝나지 않으면 아무것도 그리지 않은 화면이 영구히 남았다(2026-10-23 점검).
      //      시작할 때의 지난 기록 확인(init)은 따로 시간 제한이 있어서, 그 확인을 시작할 때와 끝났을 때 감시 시간을 새로 준다
      //      (restartLoadWatchdog). 안 그러면 확인이 시간 제한까지 걸린 날 목록을 받는 도중에 끌려 나가, 확인이 안 끝난 주문을
      //      쉬게 하지 못한 채 대기화면과 이 화면을 오간다.
      // SDK 함수를 감싸서 알아내는 방식은 쓰지 않는다: 단말기 SDK가 감싸기를 조용히 무시하면 결제창이 떠 있는 줄 모르고
      // 20초 뒤 결제 도중에 대기화면으로 끌고 가 결제가 깨졌다(2026-10-23).
      let nativeBusy = 0 // 결제·취소창(네이티브)이 떠 있는 동안 > 0 -- withNative로만 올리고 내린다
      async function withNative(fn) {
        nativeBusy += 1
        try { return await fn() } finally { nativeBusy -= 1 }
      }
      const LOAD_WATCHDOG_MS = 20000
      let loadWatchdogStopped = false
      let loadWatchdog = setTimeout(onLoadWatchdog, LOAD_WATCHDOG_MS)
      function onLoadWatchdog() {
        if (nativeBusy > 0) return
        // 대기화면으로 가는 중이다. 아직 돌고 있던 시작 단계가 그 사이 끝나 결제·취소창을 띄우지 않게 멈춘다(aborted -- 결제창 직전의
        // 검사에서 같은 키로 되돌린다).
        aborted = true
        goHome()
      }
      function stopLoadWatchdog() {
        loadWatchdogStopped = true
        clearTimeout(loadWatchdog)
      }
      function restartLoadWatchdog() {
        if (loadWatchdogStopped) return // 이미 화면을 그렸거나 결제·취소창을 띄웠다
        clearTimeout(loadWatchdog)
        loadWatchdog = setTimeout(onLoadWatchdog, LOAD_WATCHDOG_MS)
      }
      // 결제·취소를 시작하는 단계에서 감시를 다시 건다. 차량 선택 화면·[다시 결제하기]처럼 이미 화면을 그려 감시가 꺼진 뒤에 들어와도
      // 건다 -- 시작 단계가 멈추면 그 화면이 타이머 없이 남는다. 결제·취소창을 띄우기 직전에 끈다(stopLoadWatchdog).
      function armLoadWatchdog() {
        loadWatchdogStopped = false
        restartLoadWatchdog()
      }

      // 결과 보고(서버 호출)가 화면과 따로 돌고 있는 동안 > 0. 결제 완료 화면을 먼저 그리고 보고는 뒤에서 하기 때문에(startPayment),
      // 화면 타이머가 보고보다 먼저 끝나 페이지를 옮기면 진행 중이던 요청이 끊긴다 -- 돈은 받았는데 전산은 모르는 건이 생긴다.
      // 끊겨도 inflight 기록이 남아 다음 복구가 다시 보고하긴 하지만, 가능하면 끊지 않는 쪽이 낫다.
      // 결제·취소창이 닫힌 뒤 기다리는 확인·보고도 센다(trackReporting) -- 시간 제한(AFTER_NATIVE_WAIT_MS)으로 기다리기를 그만둔 뒤에도
      // 뒤에서 계속 돌기 때문이다. 반환: 그 작업의 Promise
      let reporting = 0
      function trackReporting(task) {
        reporting += 1
        const running = Promise.resolve().then(task)
        running.catch(() => {}).finally(() => { reporting -= 1 })
        return running
      }
      function reportInBackground(task) {
        trackReporting(task).catch((e) => console.error('[erp-pay] 결과 보고 오류', e))
      }

      // 화면 타이머·오류 복구가 쓰는 "처음 화면으로". 결제·취소창이 떠 있거나 결과 보고가 도는 동안은 미루고 끝나면 이동한다.
      // 예전엔 오류 안내 화면의 8초 타이머가 그냥 goHome을 불러서, 오류 뒤에도 이어진 결제 흐름의 결제창을 도중에 끌고 나갔다.
      // (손님이 직접 누른 뒤로가기·처음 화면 버튼은 그냥 goHome이다 -- 그 시점엔 창도 보고도 없다.)
      // 보고를 기다리는 데는 상한(HOME_WAIT_MAX_MS)이 있다. 저장소 쓰기(sdk.storage.set)가 응답하지 않으면 보고 뒤의 기록 정리가 끝나지
      // 않아 reporting이 0으로 돌아오지 않는다 -- 예전엔 '결제가 완료되었습니다' 화면이 영구히 남고 그 단말기는 앱을 다시 켤 때까지
      // 전산 결제를 받지 못했다(2026-10-23 점검). 상한이 지나면 보고가 남아 있어도 이동한다. 정리하지 못한 inflight 기록은 그대로 남아
      // 다음 복구가 같은 보고를 다시 한다(서버는 같은 보고를 멱등하게 받는다). 결제·취소창이 떠 있는 동안은 세지 않고 기다리기만 한다.
      // 상한은 보고 한 번의 재시도(시간 제한 12초 x 3번 + 간격, 약 45초)보다 길게 둔다.
      const HOME_WAIT_MAX_MS = 60000
      const HOME_WAIT_POLL_MS = 500
      function goHomeWhenIdle() {
        let waited = 0
        const check = () => {
          if (nativeBusy > 0) {
            setTimeout(check, HOME_WAIT_POLL_MS)
            return
          }
          if (reporting > 0 && waited < HOME_WAIT_MAX_MS) {
            waited += HOME_WAIT_POLL_MS
            setTimeout(check, HOME_WAIT_POLL_MS)
            return
          }
          if (reporting > 0) console.warn('[erp-pay] 결과 보고가 끝나지 않았지만 처음 화면으로 돌아갑니다. 남은 기록은 다음 복구가 다시 보고합니다.')
          goHome()
        }
        check()
      }

      // 토스트는 안내일 뿐이다. 이 SDK의 openToast가 거부된 Promise를 돌려주면 unhandledrejection이 되어 recoverFromError가
      // 멀쩡한 화면을 오류 안내로 덮어쓴다.
      // 아이콘은 SDK가 그릴 수 있는 'success'·'error'만 넘긴다. CDN 번들의 ICON_NAME_MAP에 이 둘뿐이고, 예전 결제 취소 안내의
      // icon: 'info'는 아이콘 이름이 없어 화면 전체가 하얗게 멈췄다 -- 환불하러 온 손님 앞에서 취소창이 뜨지 않은 채 대기화면으로
      // 돌아갔다(2026-10-23 렌더링으로 확인). 그 밖의 값은 아이콘 없이(글자만) 띄운다(공식 문서 예시).
      const TOAST_ICONS = ['success', 'error']
      function toast(options) {
        const { icon, ...rest } = options || {}
        const safe = TOAST_ICONS.includes(icon) ? { ...rest, icon } : rest
        try {
          Promise.resolve(sdk.template.openToast?.(safe)).catch(() => {})
        } catch { /* 안내일 뿐 */ }
      }

      // 결과 보고가 401·403(토큰이 틀림·매장 비활성)을 받았을 때. 기록은 남아 있고 토큰을 바로잡으면 다음 복구가 다시 보고한다.
      // 손님 화면에 뜨는 직원용 안내라 [직원 확인]을 앞에 붙인다(토스트는 3초라 짧게).
      function toastTokenProblem() {
        toast({ message: '[직원 확인] 매장 토큰이 맞지 않아 결제 결과를 못 보냈어요', icon: 'error' })
      }

      // SDK 호출(getPayment 등)은 시간 제한이 없어서, 결제를 시작하기 전 지난 시도 확인이 끝나지 않으면 화면이 그대로 멈춘다.
      // 정해진 시간이 지나면 fallback으로 끝낸다(원래 호출은 뒤에서 계속 돌 수 있다 -- 기록 정리는 같은 키끼리만 하므로 겹쳐도 안전하다).
      const PRIOR_CHECK_TIMEOUT_MS = 15000
      // 이 화면을 열 때 지난 기록 마무리를 기다리는 최대 시간(init). 결제·취소 기록을 나란히 확인하고(erp-front-pay.js는 SDK 확인
      // 호출마다 10초 제한을 둔다), 이 시간이 지나면 기다리기를 그만두고 진행한다. 확인은 뒤에서 계속 돌 수 있다 -- 기록은 서버가
      // 받았을 때 그 건만 지우므로 겹쳐도 안전하다.
      const INIT_RECOVERY_BUDGET_MS = 15000
      // 기록이 남은 주문 목록(저장소) 읽기의 시간 제한. 못 읽으면 모든 건에 기록이 있을 수 있는 것으로 본다.
      const RECORD_LOOKUP_TIMEOUT_MS = 5000
      function withTimeout(promise, ms, fallback) {
        let timer
        return Promise.race([
          Promise.resolve(promise).catch((e) => {
            console.error('[erp-pay] 지난 시도 확인 오류', e)
            return fallback
          }),
          new Promise((resolve) => { timer = setTimeout(() => resolve(fallback), ms) }),
        ]).finally(() => clearTimeout(timer))
      }

      // 결제·취소창을 띄우기 전 저장소 단계(미기록 목록 확인, 지난 기록 확인, 기록 남기기·지우기)의 시간 제한. 저장소 작업은 한 줄로 서
      // 있어서(erp-front-pay.js serialized) 앞의 쓰기 하나가 끝나지 않으면 뒤의 읽기·쓰기가 전부 기다린다. 예전엔 여기서 끝없이 기다려
      // 아무것도 그리지 않은 화면(또는 차량 선택 화면)이 그대로 남았다(2026-10-23 점검). 이 시간이 지나면 그 단계는 실패로 보고 결제·취소창을
      // 띄우지 않는다(showPriorChecking·showPriorRefundChecking -- 그 주문을 쉬게 한다).
      // 저장소 작업 자체는 끊지 않는다: 줄이 그대로라 늦게 끝난 쓰기가 그 뒤의 새 쓰기를 덮지 못한다. 시간 초과 뒤에 늦게 남은 기록은
      // 시작 요청을 보내지 않았거나 되돌린 시도의 것이라(결제·취소창은 뜨지 않았다) 다음 복구가 '결제 안 됨'으로 정리한다.
      // 읽기 한 번의 최악(시간 제한 5초 x 2 + 0.3초, erp-front-pay.js storageRead)보다 길게 둔다.
      const STORAGE_STEP_TIMEOUT_MS = 12000
      // 결제·취소창이 닫힌 뒤 결과 확인·보고(이 주문의 기록 확인, 되돌리기·완료 보고)를 기다리는 최대 시간. 보고의 재시도(약 45초)보다 길게
      // 둬서 평소에는 끝까지 기다리고, 저장소 쓰기가 멈췄을 때만 기다리기를 그만두고 화면을 넘긴다. 작업은 뒤에서 계속 돈다(trackReporting).
      const AFTER_NATIVE_WAIT_MS = 60000

      // 결제·취소창을 띄우기 전의 한 단계를 기다린다. 단계마다 흰 화면 감시 시간을 새로 준다 -- 단계는 저마다 시간 제한이 있어 평소에는
      // 감시가 먼저 울리지 않는다. 감시는 시간 제한이 없는 곳에서 멈췄을 때의 마지막 안전장치다.
      function preNativeStep(promise, ms, fallback) {
        restartLoadWatchdog()
        return withTimeout(promise, ms, fallback)
      }

      let recovering = false
      // 오류 복구가 시작되면 true. 이미 돌고 있던 결제·취소 흐름(startPayment·runRefund)은 다음 단계로 넘어가기 직전에 이 값을 보고
      // 멈춘다 -- 안 그러면 안내 화면 위로 결제창이 뜨고, 안내 화면의 타이머가 그 결제창 도중에 화면을 끌고 나간다.
      let aborted = false
      function recoverFromError(err) {
        console.error('[erp-pay] 예상하지 못한 오류', err)
        if (recovering || nativeBusy > 0) return // 결제·취소창이 떠 있으면 끝날 때까지 건드리지 않는다
        recovering = true
        aborted = true
        try {
          showMessage('error', '화면을 불러오지 못했어요', '결제 여부는 직원에게 확인해주세요', 5000)
        } catch {
          goHomeWhenIdle()
          return
        }
        setTimeout(goHomeWhenIdle, 8000) // 안내 화면의 타이머가 돌지 않는 경우 대비
      }
      window.addEventListener('error', (e) => recoverFromError(e.error || e.message))
      window.addEventListener('unhandledrejection', (e) => recoverFromError(e.reason))

      // image 타입 결과 화면은 제목·설명을 자동으로 줄바꿈하지 않는다(white-space: pre -- 긴 줄은 좌우가 잘린다). 그래서 설명은 한 줄을
      // 짧게 쓰고 필요하면 \n으로 직접 나눈다. 'N초 뒤에 닫혀요'는 SDK가 붙이므로 '잠시 후 돌아갑니다'를 따로 쓰지 않는다.
      function showMessage(status, title, description, timerMs) {
        stopLoadWatchdog()
        sdk.template.renderResultPage({
          type: 'image',
          status,
          title,
          description,
          timerMs: timerMs || 4000,
          onTimeout: goHomeWhenIdle,
          localeCode: 'ko',
        })
      }

      // 손님 화면(차량 선택·결과·안내·토스트)에 보이는 주문 이름. 차량번호가 없으면 전산 참조번호 끝 4자리를 쓴다.
      // 전산 메모(memo)는 쓰지 않는다 -- 손님 이름이나 직원 메모가 들어 있을 수 있어 예전엔 남의 이름이 손님 화면에 크게 떴다.
      function cartTitle(cart) {
        if (cart?.carNumber) return cart.carNumber
        const ref = String(cart?.referenceId ?? '').trim()
        return ref ? `주문 ${ref.slice(-4)}` : '정비 주문'
      }

      async function init() {
        const token = await pay.getToken()
        if (!token) {
          showMessage('error', '매장 토큰이 없어요', '[직원 확인] 프론트 설정 > 플러그인 설정에서\n매장 토큰을 넣어주세요', 6000)
          return
        }
        // 지난번 결제·취소가 보고 없이 끝난 기록이 남아 있으면 새 건을 받기 **전에** 마무리한다. 기록은 건별로 쌓이므로(erp-front-pay.js)
        // 보고 못 한 건이 있는 채 그 주문의 새 결제를 시작하면 그 건의 결과를 영영 못 알릴 수 있다.
        // 예전엔 이 확인에 시간 제한이 없었고, 확인이 안 끝난 기록이 하나라도 있으면 모든 주문의 결제와 취소를 막은 채 쉬지 않고
        // 대기화면으로 돌아갔다. 대기화면은 곧바로 다시 이 화면으로 넘어와 흰 화면(또는 '직원 확인이 필요합니다')과 대기화면만
        // 번갈아 보였다. 이제는 INIT_RECOVERY_BUDGET_MS까지만 기다리고, 확인이 안 끝난 기록이 걸린 건만 빼서 쉬게 한다(holdStuck --
        // 1분부터 점점 길게). 다른 주문·취소는 그대로 진행한다. 같은 주문의 새 시도는 startPaymentLocked·runRefundLocked가 한 번 더 막는다.
        restartLoadWatchdog()
        const [paymentRecovered, refundRecovered] = await Promise.all([
          withTimeout(pay.recoverInflight(token), INIT_RECOVERY_BUDGET_MS, 'pending'),
          withTimeout(pay.recoverRefundInflight(token), INIT_RECOVERY_BUDGET_MS, 'pending'),
        ])
        if (aborted) return
        restartLoadWatchdog() // 남은 단계(목록 받기 등)에 감시 시간을 새로 준다
        // 승인(또는 취소)은 됐는데 서버가 기록을 받지 않은 건이 있으면 직원 안내 화면을 먼저 띄우고 이번에는 새 결제를 띄우지 않는다.
        // 대기화면의 복구가 만든 건도 여기서 안내한다(대기화면이 이 화면으로 넘겨 준다). 그 주문은 한동안 결제창이 자동으로 뜨지 않는다.
        // 한 건당 한 번만 안내하므로 다음에 이 화면이 열리면 다른 주문은 진행된다.
        const orphans = await pay.takeOrphanNotices()
        if (aborted) return
        if (orphans.length) {
          showOrphanNotice(orphans)
          return
        }
        // 401·403: 기록은 남겨 뒀다. 토큰을 바로잡으면 다음 복구가 다시 보고한다. 토큰이 정말 틀렸으면 아래 목록 받기도 401이다.
        const tokenProblem = paymentRecovered === 'auth' || refundRecovered === 'auth'
        const { ok, status, body } = await pay.listCarts(token)
        if (aborted) return // 응답을 기다리는 사이 오류 복구 화면이 떴다 -- 그 위에 새 화면을 그리지 않는다
        if (ok) storeName = body.storeName || ''
        if (!ok) {
          if (status === 401) {
            showMessage('error', '매장 토큰이 올바르지 않아요', '[직원 확인] 프론트 설정 > 플러그인 설정에서\n다시 넣어주세요')
          } else {
            showMessage('error', '결제할 주문을 불러오지 못했어요', body.error)
          }
          return
        }
        // 기록이 남은 건(확인이 안 끝났거나 아직 뒤에서 확인 중)은 이번에 띄우지 않고 쉬게 한다. 기록 목록을 읽지 못하면 전부 걸린 것으로 본다.
        const [paymentIds, refundIds] = await Promise.all([
          withTimeout(pay.inflightCartIds(), RECORD_LOOKUP_TIMEOUT_MS, null),
          withTimeout(pay.refundInflightCartIds(), RECORD_LOOKUP_TIMEOUT_MS, null),
        ])
        if (aborted) return
        const stuck = []
        const withoutRecord = (items, ids, kind) => items.filter((item) => {
          if (ids && !ids.has(String(item.id))) return true
          pay.holdStuck(kind, item.id)
          stuck.push(item)
          return false
        })
        // 정비 대기열에서 요청한 결제 취소가 있으면 먼저 처리한다(손님이 환불받으러 프론트 앞에 와 있다).
        // 직원이 탭앱에서 [프론트에서 취소]를 두 번 눌러 이미 확정했으므로 여기서 다시 묻지 않고 바로 취소창을 띄운다.
        const refunds = withoutRecord(pay.filterStartableRefunds(body.refunds), refundIds, 'refund')
        if (refunds.length) {
          // 취소창 앞에 토스트('…결제를 취소해요. 결제한 카드를 준비해주세요')를 띄우지 않는다. SDK 토스트는 템플릿 화면(Layout) 안에서만
          // 그려지는데 이 길은 취소창 전에 아무 화면도 그리지 않아서, 토스트가 저장돼 있다가 취소가 끝난 뒤의 '환불이 완료됐어요' 화면 위에
          // 떴다 -- 환불이 끝난 손님에게 카드를 다시 준비하라고 했다(CDN SDK로 확인). 어느 차·얼마의 취소인지는 취소 뒤 화면(showRefunded·
          // showRefundStopped)에 있고, 손님 앞에 있는 직원이 탭앱에서 취소를 요청하며 결제수단별 방법을 안내받는다(settledCarts.js).
          runRefund(token, refunds[0])
          return
        }
        // 쉬는 주문과, 승인됐는데 전산이 받지 않은 결제가 걸린 주문(이중결제 위험)은 뺀다(erp-front-pay.js filterStartableCarts).
        const startable = await pay.filterStartableCarts(body.carts)
        if (aborted) return
        const carts = withoutRecord(startable, paymentIds, 'payment')
        if (!carts.length) {
          if (tokenProblem) {
            showMessage('error', '매장 토큰을 확인해주세요', '[직원 확인] 지난 결제·취소 결과를\n전산에 보내지 못했어요\n프론트 설정 > 플러그인 설정을 확인해주세요', 8000)
          } else if (stuck.length) {
            showStuckNotice(stuck)
          } else {
            goHome()
          }
          return
        }
        if (tokenProblem) toastTokenProblem()
        if (carts.length === 1) {
          // 주문내역 화면과 [결제하기] 버튼 없이 바로 통합결제창(결제수단 선택)을 띄운다.
          // 금액은 결제창에 표시되고, 품목은 직원이 정비 대기열에서 확인한다.
          // 목록을 방금 받았으므로 서버 frontOrphan을 다시 받지 않는다(justListed -- startPaymentLocked).
          startPayment(token, carts[0], { justListed: true })
          return
        }
        // 여러 건이면 손님이 자기 차를 고르게 한다. 대기 중인 손님 것을 남이 결제하지 않도록
        // 차량번호를 크게 보여준다. 선택 화면은 subtitle이 큰 제목이라 손님이 할 일(내 차 고르기)을 subtitle에 둔다.
        stopLoadWatchdog()
        // 손님이 차량을 고르지 않고 떠나면 이 화면이 영원히 남아 다음 손님이 프론트를 못 쓴다(접수 화면은 타이머가 있는데 이
        // 화면은 없었다). 60초 안에 아무것도 안 누르면 모든 주문을 쉬게 하고 대기화면으로 돌아간다 -- 쉬게 하지 않으면 대기화면이
        // 폴링하자마자 같은 선택 화면으로 되돌아온다. 쉬기는 2분이고, 직원이 주문을 다시 보내면 열쇠가 달라져 바로 다시 뜬다.
        const selectTimer = setTimeout(() => {
          carts.forEach((c) => pay.snooze(pay.cartSnoozeKey(c)))
          goHomeWhenIdle()
        }, SELECT_IDLE_MS)
        // 한 번 고르면 같은 항목·다른 항목을 또 눌러도 무시한다 -- 연타로 결제 시작이 겹치면 결제창이 두 번 뜨거나, 늦게 끝난 쪽이
        // 이긴 쪽의 기록을 건드린다. 같은 주문은 startPayment의 주문별 잠금이 한 번 더 막는다.
        let picked = false
        sdk.template.renderSelectPage({
          title: '결제할 주문이 여러 건이에요',
          subtitle: '내 차량번호를 선택해주세요',
          options: carts.map((cart) => ({
            title: `${cartTitle(cart)} · ${pay.formatWon(cart.totalAmount)}`,
            onClick: () => {
              if (picked) return
              picked = true
              clearTimeout(selectTimer)
              startPayment(token, cart)
            },
          })),
          onBack: () => {
            clearTimeout(selectTimer)
            carts.forEach((c) => pay.snooze(pay.cartSnoozeKey(c)))
            goHome()
          },
        })
      }

      // 주문별 결제 시작 잠금. 차량 선택 화면 연타·[다시 결제하기] 연타·자동 시작이 겹쳐 같은 주문의 시작이 두 번 돌면, 결제창이 두 번
      // 뜨거나 늦게 끝난 쪽이 이긴 쪽의 기록을 건드린다. 시작부터 결제창이 닫히고 결과를 정리할 때까지 같은 주문은 다시 들어오지 못한다.
      const startingCarts = new Set()

      // justListed: 방금 받은 목록의 주문이면 true(init의 자동 시작). 아니면(차량 선택 화면, [다시 결제하기]) 들고 있던 주문 정보가
      // 오래됐을 수 있어 시작 전에 서버 목록을 다시 받는다(startPaymentLocked).
      async function startPayment(token, cart, { justListed = false } = {}) {
        if (aborted) return // 오류 복구 화면이 이미 떠 있다 -- 새 결제를 시작해 그 화면을 덮지 않는다
        const lockKey = String(cart.id)
        if (startingCarts.has(lockKey)) return // 같은 주문의 시작이 이미 돌고 있다(연타)
        startingCarts.add(lockKey)
        // 흰 화면 감시는 결제창을 띄우기 직전에 끈다(startPaymentLocked). 예전엔 여기서 먼저 꺼서, 그 뒤의 저장소 쓰기가 끝나지 않으면
        // 아무것도 그리지 않은 화면이 영구히 남았다. 잠금을 잡은 뒤에 건다 -- 연타로 들어온 두 번째 호출이 이미 결제창을 띄운 흐름의
        // 감시를 다시 켜면, 창이 닫힌 뒤의 보고 도중에 끌고 나갈 수 있다.
        armLoadWatchdog()
        try {
          await startPaymentLocked(token, cart, justListed)
        } finally {
          startingCarts.delete(lockKey)
        }
      }

      // 같은 주문의 지난 시도 기록이 정리되지 않아(또는 저장소를 읽지 못해) 새 결제를 띄우지 못할 때. 그 주문만 쉬게 한다(holdStuck --
      // 1분부터 점점 길게). 예전엔 쉬게 하지 않아서, 대기화면이 곧바로 다시 이 화면으로 끌고 와 같은 안내만 되풀이했다.
      // 손님이 '다시 시도'할 방법은 없다 -- 화면은 저절로 닫히고 그 주문은 쉬었다가 다시 뜬다. 그래서 할 일 대신 사실만 알린다.
      function showPriorChecking(cart) {
        pay.holdStuck('payment', cart.id)
        showMessage('error', '이전 결제를 확인하고 있어요', '잠시 뒤 다시 확인할게요\n급하시면 직원에게 알려주세요', 5000)
      }

      // init에서 확인이 안 끝난 지난 기록 때문에 띄우지 못한 건만 있을 때의 안내. 그 건들은 이미 쉬게 했다(holdStuck).
      function showStuckNotice(items) {
        const more = items.length > 1 ? ` 외 ${items.length - 1}건` : ''
        showMessage(
          'error',
          '이전 결제를 확인하고 있어요',
          `${cartTitle(items[0])}${more}\n잠시 뒤 다시 확인할게요\n급하시면 직원에게 알려주세요`,
          8000,
        )
      }

      async function startPaymentLocked(token, cart, justListed) {
        // 서버가 이 주문에 "이미 승인된 결제가 있다"(frontOrphan, 직원 확인 전)고 알려 왔으면 결제창을 띄우지 않는다. 다른 프론트에서
        // 승인된 결제도 여기에 실린다(아래 로컬 미기록 목록은 그 승인을 받은 단말기에만 있다). 대기화면·목록에서도 거르지만
        // (filterStartableCarts) 들고 있던 주문으로 들어오는 길([다시 결제하기])도 막히게 여기서 본다. 들고 있던 값이 오래됐을 수 있어
        // 기록을 남기기 전에 서버 목록으로 한 번 더 본다(아래 justListed).
        const knownServerOrphan = pay.serverOrphanOf(cart)
        if (knownServerOrphan) {
          showServerOrphanNotice(cart, knownServerOrphan)
          return
        }

        // 승인됐는데 전산이 기록하지 못한 결제가 이 주문에 걸려 있으면 새 결제를 띄우지 않는다(이중결제 방지). 대기화면과 목록에서도
        // 거르지만 [다시 결제하기] 같은 다른 길로 들어와도 막히게 여기서 한 번 더 본다.
        // 저장소 단계마다 시간 제한이 있다(STORAGE_STEP_TIMEOUT_MS) -- 시간이 지나면 읽지 못한 것으로 보고 띄우지 않는다.
        const orphan = await preNativeStep(pay.findOrphanBlock(cart), STORAGE_STEP_TIMEOUT_MS, pay.ORPHANS_UNREADABLE)
        if (aborted) return
        if (orphan === pay.ORPHANS_UNREADABLE) {
          // 미기록 목록을 읽지 못했다 -- 이 주문에 그런 결제가 걸려 있는지 모르므로 띄우지 않는다.
          showPriorChecking(cart)
          return
        }
        if (orphan) {
          showOrphanNotice([orphan], cart)
          return
        }

        // 같은 주문에 정리 안 된 지난 시도 기록이 남아 있으면(결과 보고 실패 등) 새 시도보다 먼저 마무리한다. 기록 칸은 주문당 하나라
        // 새 시도가 그 칸을 덮어쓰면 지난 시도를 되돌리거나 승인을 보고할 근거가 사라진다. 끝내 확인이 안 되면 시작하지 않는다.
        // null: 기록이 있는지 확인하지 못했다(시간 초과) -- 덮어쓸 수 있으니 시작하지 않는다.
        const hasPrior = await preNativeStep(pay.hasInflight(cart.id), STORAGE_STEP_TIMEOUT_MS, null)
        if (aborted) return
        if (hasPrior === null) {
          showPriorChecking(cart)
          return
        }
        if (hasPrior) {
          const prior = await preNativeStep(pay.recoverInflight(token, cart.id), PRIOR_CHECK_TIMEOUT_MS, 'pending')
          if (aborted) return
          if (prior === 'paid') {
            showMessage('success', '이미 결제된 주문이에요', '다시 결제하지 않으셔도 돼요', 5000)
            return
          }
          if (prior === 'orphan') {
            showOrphanNotice(await preNativeStep(pay.takeOrphanNotices(), STORAGE_STEP_TIMEOUT_MS, []), cart)
            return
          }
          if (prior === 'auth') toastTokenProblem()
          if (prior === 'pending' || prior === 'auth' || await preNativeStep(pay.hasInflight(cart.id), STORAGE_STEP_TIMEOUT_MS, true)) {
            showPriorChecking(cart)
            return
          }
          if (aborted) return
        }

        // 차량 선택 화면에서 머물렀거나 [다시 결제하기]로 들어왔으면 들고 있던 주문 정보가 오래됐다. 그 사이 다른 프론트의 늦은 승인 보고가
        // 이 주문에 frontOrphan으로 남았을 수 있어(손님이 이 프론트의 결제창을 닫은 사이 등) 서버 목록을 다시 받아 본다. 목록을 받지 못하면
        // 확인하지 못한 것이라 시작하지 않는다. 목록에 이 주문이 없으면(이미 결제 중이거나 끝남, 또는 목록 한도 밖) 시작 요청에서 서버가
        // 상태를 가린다.
        if (!justListed) {
          restartLoadWatchdog()
          const listed = await pay.listCarts(token)
          if (aborted) return
          if (!listed.ok) {
            showMessage('error', '결제를 시작하지 못했어요', listed.body?.error || '잠시 뒤 다시 시도할게요')
            return
          }
          const latest = (listed.body?.carts || []).find((c) => String(c.id) === String(cart.id))
          const latestServerOrphan = latest ? pay.serverOrphanOf(latest) : null
          if (latestServerOrphan) {
            showServerOrphanNotice(latest, latestServerOrphan)
            return
          }
          // 차량 선택 화면에 머무는 사이 전산이 같은 주문을 금액·품목을 바꿔 다시 보냈을 수 있다(같은 id로 덮어쓴다). 결제 뒤 화면·영수증은
          // 이 주문 정보로 그리므로 방금 받은 값으로 바꿔 쓴다. 목록에 없으면 들고 있던 값 그대로다(아래 시작 응답의 금액으로 한 번 더 맞춘다).
          if (latest) cart = latest
        }

        const paymentKey = crypto.randomUUID()
        // amount·sentKey는 보고가 끝내 거절될 때 미기록 목록에 옮길 값이다(erp-front-pay.js reportPaid).
        const record = { cartId: cart.id, paymentKey, amount: cart.totalAmount, sentKey: pay.cartSnoozeKey(cart) }

        // 시작 요청(start)을 보내기 **전에** 기록한다. 시작 요청이 시간 초과로 끝나면 서버가 이 키로 '결제 중'을 잡았는지 알 수
        // 없는데, 기록이 있어야 다음에 켜질 때 같은 키로 되돌릴 수 있다(erp-front-pay.js recoverInflight). 예전엔 start가 성공한
        // 뒤에야 기록해서, 시간 초과 건은 되돌릴 근거가 없어 주문이 '손님 결제 중'에 영구히 갇혔다.
        // 그 사이 다른 시도의 기록이 생겼거나 저장소에 기록을 남기지 못했으면(시간 초과 포함) 시작하지 않는다(claimInflight). 시간 초과 뒤에
        // 늦게 남은 이 기록은 시작 요청을 보내지 않은 키라 다음 복구가 '결제 안 됨'으로 정리한다.
        if (!await preNativeStep(pay.claimInflight({ ...record, phase: 'starting' }), STORAGE_STEP_TIMEOUT_MS, false)) {
          showPriorChecking(cart)
          return
        }
        restartLoadWatchdog()
        const started = await pay.startCart(token, cart.id, paymentKey)
        if (!started.ok) {
          if (started.status === 0 || started.status >= 500) {
            // 시간 초과·연결 끊김·서버 오류(게이트웨이 시간 초과 포함): 서버는 이 키로 '결제 중'을 잡았을 수 있다. 결제창은 아직 안
            // 띄웠으니(돈이 나가지 않았다) 같은 키로 되돌려 둔다. 서버는 아직 시작 안 된 키의 이 보고를 기억해 두고 늦게 도착하는
            // start를 거절한다. 보고가 서버에 닿은 게 확인되면 기록을 지우고, 닿지 못했으면 남겨 둬 다음 복구가 다시 보고한다.
            releaseInBackground(token, cart, paymentKey)
          } else {
            // 서버가 분명히 거절했다(409 등 4xx) -- 이 키로는 시작된 게 없다. 이번 시도가 방금 남긴 기록만 지운다(같은 칸에 다른
            // 시도의 기록이 들어 있으면 그대로 둔다). 지우기가 시간 안에 끝나지 않으면 기록은 남고 다음 복구가 정리한다.
            await preNativeStep(pay.clearInflight(cart.id, paymentKey), STORAGE_STEP_TIMEOUT_MS, false)
          }
          if (started.status === 409 && started.body?.code === 'FRONT_ORPHAN') {
            // 목록을 받은 뒤 다른 프론트의 늦은 승인이 기록된 경우 -- 서버가 시작을 막았다.
            showServerOrphanNotice(cart, started.body.frontOrphan || {})
          } else if (started.status === 409) {
            showMessage('error', '이미 처리 중인 주문이에요', '다른 단말기에서 결제 중이거나\n이미 결제된 주문이에요')
          } else {
            showMessage('error', '결제를 시작하지 못했어요', started.body.error || '잠시 뒤 다시 시도할게요')
          }
          return
        }
        record.amount = started.body.totalAmount ?? cart.totalAmount // 서버 기준 금액
        // 결제창은 시작 응답의 금액(서버 기준)으로 결제한다. 결제 뒤 화면(금액)·영수증(품목·할인)·다시 결제 안내도 같은 값을 써야 한다 --
        // 들고 있던 주문 정보로 그리면 그 사이 전산이 주문을 바꿨을 때 손님 화면과 출력 영수증이 실제 결제와 다른 금액·품목을 보였다.
        // 시작 응답에 품목이 있으면 그것을, 없는데 금액이 다르면 품목을 비운다(영수증은 품목 없이 결제 영수증만 -- receiptOrderInfo).
        const paidCart = paidCartOf(cart, started.body)
        if (!await preNativeStep(pay.claimInflight({ ...record, phase: 'paying' }), STORAGE_STEP_TIMEOUT_MS, false)) {
          // 기록을 고쳐 쓰지 못했다(칸에 다른 시도의 기록이 있거나 저장소 오류·시간 초과). 기록 없이 결제창을 띄우면 결과를 복구할 수
          // 없으니 되돌린다. 'starting' 기록은 남아 있으므로 되돌리기 보고가 닿지 못해도 다음 복구가 같은 키로 다시 되돌린다.
          releaseInBackground(token, cart, paymentKey)
          showPriorChecking(cart)
          return
        }

        // 시작 요청을 기다리는 사이 오류 복구 화면이 떴으면 결제창을 띄우지 않고 같은 키로 되돌린다. 이 검사와 withNative
        // 사이에 await를 두지 마라 -- 검사를 통과한 뒤 nativeBusy가 오르기 전에 복구가 끼어들 틈이 생긴다.
        if (aborted) {
          releaseInBackground(token, cart, paymentKey)
          return
        }
        stopLoadWatchdog() // 결제창이 떠 있는 동안, 그리고 창이 닫힌 뒤의 결과 정리 도중에 끌고 나가지 않는다
        // 결제창 앞에 토스트('12가3456 · 55,000원 정비 결제예요')를 띄우지 않는다. SDK 토스트는 템플릿 화면(Layout) 안에서만 그려진다 --
        // 주문 한 건 자동 결제는 결제창 전에 아무 화면도 그리지 않아, 토스트가 결제창 전에는 보이지 않고 창이 닫힌 뒤의 결과 화면 위에
        // 늦게 떴다(CDN SDK로 확인). 어느 차·얼마인지는 앞 화면(여러 건이면 차량 선택)과 뒤 화면(showPaid·showRetryChoice)에 있다.

        let result
        try {
          // 금액은 서버가 내려준 값을 쓴다 -- 화면에 들고 있던 값이 그 사이 바뀌었을 수 있다.
          result = await withNative(() => sdk.payment.requestPayment({
            paymentKey,
            tax: started.body.tax,
            supplyValue: started.body.supplyValue,
            tip: 0,
            timeoutMs: 60000,
            localeCode: 'ko',
          }))
        } catch (err) {
          // 예외만으로는 승인 여부를 알 수 없다. 단말기 캐시를 확인해 승인이면 paid로, 아니면 되돌린다.
          console.error('[erp-pay] requestPayment 예외', err)
          // 이 주문의 기록만 본다 -- 다른 건의 확인 불가가 이 건 결과를 흐리지 않게. 저장소가 멈춰 끝나지 않으면 AFTER_NATIVE_WAIT_MS 뒤
          // '확인하지 못했어요'로 넘어간다(확인은 뒤에서 계속 돌고, 기록은 남아 다음 복구가 다시 본다).
          const recovered = await withTimeout(trackReporting(() => pay.recoverInflight(token, cart.id)), AFTER_NATIVE_WAIT_MS, 'pending')
          if (recovered === 'paid') {
            showPaid(paidCart, paymentKey)
          } else if (recovered === 'orphan') {
            // 승인은 됐는데 서버가 받지 않았다. 손님은 결제했으니 영수증은 뽑고, 직원이 알 수 있게 안내한다.
            printReceiptFor(paidCart, paymentKey).catch((e) => console.error('[erp-pay] 영수증 출력 오류', e))
            showOrphanNotice(await withTimeout(pay.takeOrphanNotices(), STORAGE_STEP_TIMEOUT_MS, []), paidCart)
          } else if (recovered === 'released') {
            showRetryChoice(token, paidCart, '결제가 완료되지 않았어요')
          } else {
            if (recovered === 'auth') toastTokenProblem()
            showMessage('error', '결제 상태를 확인하지 못했어요', '결제됐는지 확인이 필요해요\n직원에게 알려주세요', 8000)
          }
          return
        }

        if (result.type === 'SUCCESS') {
          // 결제 완료 화면(과 영수증 출력)을 **먼저** 그리고 서버 보고는 뒤에서 한다. 예전엔 보고를 기다린 뒤에 화면을 그렸는데,
          // 서버가 느리면(시간 제한 12초 x 재시도 3번) 손님이 결제를 끝내고도 한참 흰 화면을 봤다. 보고가 끝나기 전에는 화면
          // 타이머가 페이지를 옮기지 않는다(goHomeWhenIdle -- 최대 1분, 그 뒤엔 남은 기록을 다음 복구가 보고한다). showPaid가 예외로
          // 끝나도 보고는 반드시 한다.
          try {
            showPaid(paidCart, paymentKey)
          } finally {
            reportPaidInBackground(token, paidCart, record, result.response)
          }
          return
        }

        // CANCELED / TIMEOUT / 그 외 실패 -- 돈이 나가지 않았다. 다시 결제할 수 있게 되돌린다.
        // 서버가 받았거나 확정적으로 거절했을 때만 기록을 지운다. 429·네트워크 오류·인증 문제면 남겨 둬서 다음 복구가 (단말기에
        // 승인이 없으니 'cancelled'로) 다시 보고한다(erp-front-pay.js reportReleased). 남은 기록이 있는 동안 [다시 결제하기]는
        // 그 기록부터 정리한다(startPaymentLocked).
        // 보고 뒤의 기록 정리(저장소 쓰기)가 끝나지 않으면 AFTER_NATIVE_WAIT_MS 뒤 기다리기를 그만두고 화면을 넘긴다(보고는 뒤에서 계속 돈다).
        const failed = result.type !== 'CANCELED' && result.type !== 'TIMEOUT'
        const released = await withTimeout(trackReporting(() => pay.reportReleased(token, cart.id, paymentKey, {
          result: failed ? 'failed' : 'cancelled',
          errorMessage: failed ? `프론트 결제 실패(${result.type})` : undefined,
        })), AFTER_NATIVE_WAIT_MS, 'pending')
        if (released === 'auth') toastTokenProblem()
        // 손님이 결제창을 닫았거나 시간이 지났다(돈이 나가지 않았다). 예전 제목 '결제가 취소되었습니다'는 환불이 끝난 화면(showRefunded)과
        // 같아서, 정반대인 두 상황을 손님도 직원도 헷갈렸다. 환불 완료는 '환불이 완료됐어요'로 나눈다.
        showRetryChoice(token, paidCart, failed ? '결제에 실패했어요' : '결제가 진행되지 않았어요')
      }

      // 결제 완료 보고(erp-front-pay.js reportPaid). 서버가 기록했을 때만 inflight 기록을 지운다. 409·404 같은 확정 거절은 성공이
      // 아니다 -- 미기록 목록에 옮기고, 이미 "결제 완료"로 나간 화면을 직원 안내 화면으로 바꾼다(그 주문의 결제창 자동 시작도 막힌다).
      // 인증 문제(401·403)·네트워크 오류·5xx는 기록을 남긴 채 두고, 다음에 이 단말기가 켜질 때 recoverInflight가 다시 보고한다.
      function reportPaidInBackground(token, cart, record, response) {
        reportInBackground(async () => {
          const outcome = await pay.reportPaid(token, record, pay.extractPayment(response))
          if (outcome === 'orphan') {
            // 오류 복구 화면이 떠 있으면 덮지 않는다 -- 안내는 남아 있어 다음에 이 화면이 열릴 때 띄운다(init).
            if (!recovering) showOrphanNotice(await withTimeout(pay.takeOrphanNotices(), STORAGE_STEP_TIMEOUT_MS, []), cart)
          } else if (outcome === 'auth') {
            toastTokenProblem()
          } else if (outcome === 'pending') {
            console.warn('[erp-pay] 결제 완료 보고가 아직 받아들여지지 않았습니다. 기록을 남겨 두고 다음에 다시 보고합니다.')
          }
        })
      }

      // 시작 요청이 시간 초과였거나(서버가 결제 중으로 잡았을 수 있다) 시작 직후 오류 복구가 화면을 가져가서 결제창을 못 띄운
      // 건을 같은 키로 되돌린다. 보고가 서버에 닿았을 때만 이 키의 기록을 지운다(닿지 못하면 다음 복구가 다시 한다).
      function releaseInBackground(token, cart, paymentKey) {
        reportInBackground(() => pay.reportReleased(token, cart.id, paymentKey))
      }

      // 승인(또는 취소)은 됐는데 서버가 그 보고를 끝내 받지 않은 건의 직원 안내 화면. 승인번호·금액으로 토스 결제내역과 맞춰 보게 한다.
      // orphans: erp-front-pay.js takeOrphanNotices·findOrphanBlock 결과(비어 있을 수 있다). subject: 지금 화면의 주문(있으면
      // 그 주문의 건을 앞에 두고 차량번호를 함께 보인다). kind: orphans가 비었을 때 문구를 고르는 값('payment' | 'refund').
      function showOrphanNotice(orphans, subject, kind) {
        const list = orphans || []
        const first = (subject && list.find((o) => String(o.cartId) === String(subject.id))) || list[0] || null
        const isRefund = (first?.kind || kind) === 'refund'
        const sameCart = subject && (!first || String(first.cartId) === String(subject.id))
        const amount = first?.amount ?? (sameCart ? subject.totalAmount : null)
        const details = [
          sameCart ? cartTitle(subject) : '',
          first?.approvalNumber ? `${isRefund ? '결제 승인번호' : '승인번호'} ${first.approvalNumber}` : '',
          amount != null ? pay.formatWon(amount) : '',
        ].filter(Boolean).join(' · ')
        const more = list.length > 1 ? ` 외 ${list.length - 1}건` : ''
        // 손님에게는 '완료됐다'를 먼저 알린다 -- '전산에 기록하지 못했습니다'는 손님을 불안하게 해 다시 결제하게 만들 수 있다.
        // 승인번호·금액은 직원이 토스 결제내역과 맞춰 보는 값이라 줄을 나눠 읽기 쉽게 둔다(image 타입은 줄을 자동으로 바꾸지 않는다).
        showMessage(
          'error',
          isRefund ? '결제 취소는 완료됐어요\n직원 확인이 필요해요' : '결제는 완료됐어요\n직원 확인이 필요해요',
          `직원에게 알려주세요${details ? `\n${details}` : ''}${more}`,
          10000,
        )
      }

      // 서버가 알려 준 확인 전 승인(cart.frontOrphan {at, approvalNo, amount, ackAt})이 걸린 주문의 직원 안내. 이 프론트가 받은 승인이 아닐 수
      // 있어(다른 프론트, 전산이 다시 보낸 주문) 로컬 미기록 안내(showOrphanNotice)와 문구를 나눈다. 직원이 POS에서 확인하면(결제로 기록하거나
      // 확인 처리 -- ackAt) 다음 폴링부터 다시 결제할 수 있다. 쉬게 하지 않는다 -- 서버 값이 남아 있는 동안은 대기화면이 이 주문을 넘기지 않는다.
      function showServerOrphanNotice(cart, orphan) {
        const rawAmount = orphan?.amount
        const amount = rawAmount === null || rawAmount === undefined || rawAmount === '' ? NaN : Number(rawAmount)
        const details = [
          cartTitle(cart),
          orphan?.approvalNo ? `승인번호 ${orphan.approvalNo}` : '',
          Number.isFinite(amount) ? pay.formatWon(amount) : '',
        ].filter(Boolean).join(' · ')
        showMessage(
          'error',
          '이미 결제가 승인된 주문이에요',
          `직원 확인이 필요해요${details ? `\n${details}` : ''}`,
          10000,
        )
      }

      // 결제 뒤 화면·영수증에 쓸 주문 정보를 시작 응답(서버 기준)에 맞춘다(startPaymentLocked). 금액은 응답의 totalAmount, 품목은 응답에
      // items가 있으면 그것을 쓴다. 응답에 품목이 없는데 금액이 들고 있던 값과 다르면 품목도 바뀌었을 수 있어 비운다 -- 틀린 품목으로
      // 영수증을 뽑느니 결제 영수증만 뽑는다(receiptOrderInfo가 null). 옛 서버처럼 금액이 없으면 들고 있던 값 그대로다.
      function paidCartOf(cart, startBody) {
        const raw = startBody?.totalAmount
        const amount = raw === null || raw === undefined || raw === '' ? NaN : Number(raw)
        const serverItems = Array.isArray(startBody?.items) ? startBody.items : null
        if (!Number.isFinite(amount)) return serverItems ? { ...cart, items: serverItems } : cart
        const changed = amount !== Number(cart.totalAmount)
        return { ...cart, totalAmount: amount, items: serverItems || (changed ? [] : cart.items) }
      }

      // 결제가 끝나면 영수증을 기본으로 출력한다(프론트에 연결된 프린터, sdk.printer.printReceipt). 전산 주문의 품목·단가를
      // 넣어 뽑고, 품목 합계가 결제 금액보다 크면 차액을 '할인'으로 넣어 맞춘다(작으면 품목 없이 결제 영수증만).
      // 품목을 넣은 출력이 실패하면 결제 영수증만 한 번 더 시도한다. 프린터가 없거나 끝내 실패해도 결제에는 영향이 없다.
      function receiptOrderInfo(cart) {
        const items = (cart.items || []).filter((i) => i && i.name)
        if (!items.length) return null
        const orderItems = items.map((i) => ({
          count: Math.max(1, Number(i.quantity) || 1),
          menu: { title: String(i.name).slice(0, 40), originPrice: Math.max(0, Number(i.unitPrice) || 0), selectOptions: [] },
          discounts: [],
        }))
        const sum = orderItems.reduce((acc, o) => acc + o.count * o.menu.originPrice, 0)
        const total = Number(cart.totalAmount) || 0
        if (sum < total) return null
        return { orderItems, discounts: sum > total ? [{ title: '할인', price: sum - total }] : [] }
      }

      async function printReceiptFor(cart, paymentKey) {
        if (!paymentKey || typeof sdk.printer?.printReceipt !== 'function') return
        const additionalText = [storeName, cart.carNumber ? `차량번호 ${cart.carNumber}` : ''].filter(Boolean).join(' · ')
        const base = { paymentKey, count: 1, ...(additionalText ? { additionalText } : {}) }
        const orderInfo = receiptOrderInfo(cart)
        try {
          await sdk.printer.printReceipt(orderInfo ? { ...base, orderInfo } : base)
          return
        } catch (e) {
          console.warn('[erp-pay] 영수증 출력 실패', e)
        }
        if (orderInfo) {
          try {
            await sdk.printer.printReceipt(base)
            return
          } catch (e) {
            console.error('[erp-pay] 결제 영수증 출력도 실패', e)
          }
        }
        toast({ message: '영수증을 출력하지 못했어요. 프린터를 확인해주세요', icon: 'error' })
      }

      function showPaid(cart, paymentKey) {
        stopLoadWatchdog() // 화면마다 자기 타이머가 있다(showMessage와 같다)
        printReceiptFor(cart, paymentKey).catch((e) => console.error('[erp-pay] 영수증 출력 오류', e))
        sdk.template.renderResultPage({
          type: 'text',
          text: pay.formatWon(cart.totalAmount),
          title: '결제가 완료됐어요',
          description: `${cartTitle(cart)}\n감사합니다`,
          timerMs: 8000, // 영수증이 나오는 동안 이 화면을 둔다
          onTimeout: goHomeWhenIdle, // 결과 보고가 아직 돌고 있으면 끝날 때까지(최대 1분) 기다린다
          localeCode: 'ko',
        })
      }

      // 결제가 중단됐을 때의 화면. 예전엔 선택 화면(다시 시도/처음 화면으로)이라 아무도 안 누르면 그대로 멈춰
      // 있었고, 그동안 대기화면이 아니라 새 결제·취소를 받아 가지 못했다(손님이 그냥 떠나면 프론트가 먹통이 된다).
      // 그래서 결과 화면 + [다시 시도] 버튼으로 바꾸고 10초 뒤 저절로 대기화면으로 돌아가게 한다. 돌아간 뒤 같은 건이
      // 바로 다시 뜨지 않게 2분 쉬게 한다(snooze). 버튼을 눌러 다음 화면으로 갔으면 타이머가 대기화면으로 끌고 가지 않는다.
      // 버튼 연타는 한 번만 받는다(startPayment의 주문별 잠금도 막는다). 결제 취소는 이 화면을 쓰지 않는다(showRefundStopped).
      function showStoppedWithRetry({ title, description, retryLabel, onRetry, snoozeKey }) {
        stopLoadWatchdog()
        pay.snooze(snoozeKey)
        let left = false
        sdk.template.renderResultPage({
          type: 'image',
          status: 'error',
          title,
          description,
          buttons: [{ label: retryLabel, onClick: () => { if (left) return; left = true; onRetry() } }],
          timerMs: 10000,
          onTimeout: () => { if (!left) goHomeWhenIdle() },
          localeCode: 'ko',
        })
      }

      function showRetryChoice(token, cart, title) {
        showStoppedWithRetry({
          title,
          description: `${cartTitle(cart)} · ${pay.formatWon(cart.totalAmount)}\n다시 결제하려면 아래 버튼을 눌러주세요`,
          retryLabel: '다시 결제하기',
          onRetry: () => startPayment(token, cart),
          snoozeKey: pay.cartSnoozeKey(cart),
        })
      }

      // --- 결제 취소 ---------------------------------------------------------------
      // 정비 대기열(POS 탭앱)에서 [프론트에서 취소]를 누르면 여기로 와서 확인 화면 없이 바로 취소창(카드 꽂기)이
      // 뜬다. 카드 결제는 결제했던 카드를 다시 꽂아야 한다(NICE VAN 카드는 카드 없이 취소된다 -- erp-front-pay.js
      // requestRefund). 손님이 자리에 없어 취소창이 시간 초과로 닫히면 대기화면이 3초마다 취소창을 다시 띄워 다른
      // 손님이 프론트를 못 쓰게 된다. 그래서 취소가 끝나지 않으면 2분 동안 다시 띄우지 않는다(snooze).
      // 취소가 중단·실패하면 서버가 주문을 결제 완료(paid)로 되돌리므로, 다시 취소하려면 직원이 [프론트에서 취소]를 다시 눌러야 한다
      // (이 화면에 [다시 시도하기]를 두지 않는 이유 -- showRefundStopped).
      // 주문별 취소 시작 잠금(결제의 startingCarts와 같은 이유).
      const refundingCarts = new Set()

      async function runRefund(token, item) {
        if (aborted) return // 오류 복구 화면이 이미 떠 있다 -- 새 취소를 시작해 그 화면을 덮지 않는다
        const lockKey = String(item.id)
        if (refundingCarts.has(lockKey)) return
        refundingCarts.add(lockKey)
        armLoadWatchdog() // startPayment와 같다 -- 취소창을 띄우기 직전에 끈다(runRefundLocked)
        try {
          await runRefundLocked(token, item)
        } finally {
          refundingCarts.delete(lockKey)
        }
      }

      // 쉬기는 두 가지다: 이 요청(requestedAt)의 2분 쉬기와, 기록이 정리될 때까지 1분부터 점점 길어지는 쉬기(showPriorChecking과 같다).
      function showPriorRefundChecking(item) {
        pay.snooze(pay.refundSnoozeKey(item))
        pay.holdStuck('refund', item.id)
        showMessage('error', '이전 결제 취소를 확인하고 있어요', '잠시 뒤 다시 확인할게요\n급하시면 직원에게 알려주세요', 5000)
      }

      async function runRefundLocked(token, item) {
        // 결제와 같다(startPaymentLocked): 같은 주문에 정리 안 된 지난 취소 시도 기록이 있으면 먼저 마무리하고, 끝내 확인이 안 되면
        // 새 시도를 시작하지 않는다. 새 시도가 그 기록을 덮어쓰면 실제로 끝난 취소를 알릴 근거가 사라진다.
        // 저장소 단계의 시간 제한도 결제와 같다(STORAGE_STEP_TIMEOUT_MS) -- null은 확인하지 못함(시간 초과)이라 시작하지 않는다.
        const hasPrior = await preNativeStep(pay.hasRefundInflight(item.id), STORAGE_STEP_TIMEOUT_MS, null)
        if (aborted) return
        if (hasPrior === null) {
          showPriorRefundChecking(item)
          return
        }
        if (hasPrior) {
          const prior = await preNativeStep(pay.recoverRefundInflight(token, item.id), PRIOR_CHECK_TIMEOUT_MS, 'pending')
          if (aborted) return
          if (prior === 'refunded') {
            showRefunded(item)
            return
          }
          if (prior === 'orphan') {
            showOrphanNotice(await preNativeStep(pay.takeOrphanNotices(), STORAGE_STEP_TIMEOUT_MS, []), item, 'refund')
            return
          }
          if (prior === 'auth') toastTokenProblem()
          if (prior === 'pending' || prior === 'auth' || await preNativeStep(pay.hasRefundInflight(item.id), STORAGE_STEP_TIMEOUT_MS, true)) {
            showPriorRefundChecking(item)
            return
          }
          if (aborted) return
        }

        // 이 "시도"의 이름표. 서버는 start·result마다 이 값이 진행 중인 시도와 같은지 보고, 다르면 409 { stale:true }로 거절한다.
        // 시간 초과로 늦게 도착한 옛 시도의 요청이 새 시도를 되돌리거나 완료 처리하는 것을 막는다.
        const attemptId = crypto.randomUUID()
        // approvalNumber(원결제)·amount는 완료 보고가 끝내 거절될 때 직원 안내에 쓴다(erp-front-pay.js reportRefunded).
        const record = {
          cartId: item.id,
          paymentKey: item.refund?.paymentKey,
          attemptId,
          approvalNumber: item.refund?.approvalNumber,
          amount: item.totalAmount,
        }
        // start를 보내기 **전에** 기록한다(결제와 같은 이유 -- start가 시간 초과로 끝나면 서버가 '취소 중'을 잡았는지 모르는데
        // 기록이 있어야 다음에 되돌린다). refund의 paymentKey는 start 응답에 오는 값이 정본이라 성공하면 그 값으로 다시 저장한다.
        if (!await preNativeStep(pay.claimRefundInflight(record), STORAGE_STEP_TIMEOUT_MS, false)) {
          showPriorRefundChecking(item)
          return
        }
        restartLoadWatchdog()
        const started = await pay.startRefund(token, item.id, attemptId)
        if (!started.ok) {
          pay.snooze(pay.refundSnoozeKey(item))
          if (started.status === 0 || started.status >= 500) {
            // 시간 초과·서버 오류: 서버가 '취소 중'을 잡았을 수 있다. 취소창은 아직 안 띄웠으니 되돌려 둔다(결제와 같은 이유).
            // 보고가 서버에 닿았을 때만 기록을 지우고, 못 닿았으면 남겨 둬 다음 복구가 같은 attemptId로 다시 보고한다.
            releaseRefundInBackground(token, record)
          } else {
            // 서버가 분명히 거절했다(409 stale 포함 4xx) -- 이 시도로 시작된 건 없다. 이 시도의 기록만 지운다(시간 안에 못 지우면 남고
            // 다음 복구가 정리한다).
            await preNativeStep(pay.clearRefundInflight(item.id, attemptId), STORAGE_STEP_TIMEOUT_MS, false)
          }
          if (started.status === 409 && started.body?.status === 'paid') {
            // 취소 요청이 그 사이 끝났거나 중단돼 결제 완료로 돌아갔다. 다시 취소하려면 직원이 다시 요청해야 한다.
            showMessage('error', '결제 취소를 시작하지 못했어요', '다시 취소하려면 직원에게 말씀해주세요', 6000)
          } else {
            showMessage('error', '결제 취소를 시작하지 못했어요', started.body.error || '직원에게 알려주세요')
          }
          return
        }
        const refund = started.body.refund || item.refund
        const active = { ...record, paymentKey: refund.paymentKey, approvalNumber: refund.approvalNumber ?? record.approvalNumber }
        if (!await preNativeStep(pay.claimRefundInflight(active), STORAGE_STEP_TIMEOUT_MS, false)) {
          // 기록을 고쳐 쓰지 못했다(칸에 다른 시도의 기록이 있거나 저장소 오류·시간 초과). 기록 없이 취소창을 띄우면 결과를 복구할 수 없으니 되돌린다.
          releaseRefundInBackground(token, active)
          showPriorRefundChecking(item)
          return
        }

        // 결제와 같다: start를 기다리는 사이 오류 복구 화면이 떴으면 취소창을 띄우지 않고 되돌린다. 이 검사와 withNative 사이에
        // await를 두지 마라.
        if (aborted) {
          pay.snooze(pay.refundSnoozeKey(item))
          releaseRefundInBackground(token, active)
          return
        }

        // 취소창을 띄우기 **직전에** 쉬게 한다. 어느 갈래로 끝나든(성공·중단·실패·예외) 같은 취소가 5초 폴링마다 되풀이되지
        // 않게 하려는 것이다. 예전엔 중단·실패 갈래에서만 쉬게 해서, requestRefund가 예외로 끝나는 갈래(아래 catch)는 쉬지 않아
        // 같은 취소창이 끝없이 다시 떴고 그동안 다른 결제 주문을 받지 못했다. 직원이 취소를 다시 요청하면 requestedAt이 바뀌어
        // 쉬기 열쇠(refundSnoozeKey)가 달라지므로 그때는 바로 뜬다.
        pay.snooze(pay.refundSnoozeKey(item))
        stopLoadWatchdog() // 결제와 같다(startPaymentLocked)

        let result
        try {
          result = await withNative(() => pay.requestRefund(refund))
        } catch (err) {
          console.error('[erp-pay] 결제 취소 요청 예외', err)
          // 이 주문의 기록만. 저장소가 멈춰 끝나지 않으면 AFTER_NATIVE_WAIT_MS 뒤 '확인하지 못했어요'로 넘어간다(결제와 같다).
          const recovered = await withTimeout(trackReporting(() => pay.recoverRefundInflight(token, item.id)), AFTER_NATIVE_WAIT_MS, 'pending')
          if (recovered === 'refunded') {
            showRefunded(item)
          } else if (recovered === 'orphan') {
            showOrphanNotice(await withTimeout(pay.takeOrphanNotices(), STORAGE_STEP_TIMEOUT_MS, []), item, 'refund')
          } else if (recovered === 'released') {
            // 취소가 안 됐고 서버도 주문을 결제 완료로 되돌렸다. 이 화면에서 다시 시도할 수 없다(showRefundStopped).
            showRefundStopped(item, '결제 취소가 완료되지 않았어요')
          } else {
            // 'pending'·'auth'(됐는지 아직 모른다). 예전의 [다시 시도하기]는 남은 기록 때문에 시작하지 못하고(서버도 아직 이 시도로
            // 취소 중이라 409) 항상 실패했다 -- 버튼 없이 안내만 하고 저절로 대기화면으로 돌아간다. 기록은 다음 복구가 마무리한다.
            if (recovered === 'auth') toastTokenProblem()
            showMessage('error', '결제 취소 상태를 확인하지 못했어요', '취소됐는지 확인이 필요해요\n직원에게 알려주세요', 8000)
          }
          return
        }

        if (result.type === 'SUCCESS') {
          // 서버가 기록했을 때만 기록을 지운다. 끝내 받지 않으면(409 stale 포함) 미기록 목록에 옮기고 직원 안내 화면을 띄운다.
          // 인증 문제·네트워크 오류면 기록을 남겨 두고 다음 복구가 다시 보고한다(erp-front-pay.js reportRefunded).
          // 보고 뒤의 기록 정리가 끝나지 않으면 AFTER_NATIVE_WAIT_MS 뒤 '환불이 완료됐어요'를 띄운다(손님 돈은 돌려줬다. 보고는 뒤에서 계속 돈다).
          const outcome = await withTimeout(trackReporting(() => pay.reportRefunded(token, active)), AFTER_NATIVE_WAIT_MS, 'pending')
          if (outcome === 'orphan') {
            showOrphanNotice(await withTimeout(pay.takeOrphanNotices(), STORAGE_STEP_TIMEOUT_MS, []), item, 'refund')
            return
          }
          if (outcome === 'auth') toastTokenProblem()
          showRefunded(item)
          return
        }

        const failed = result.type !== 'CANCELED' && result.type !== 'TIMEOUT'
        const released = await withTimeout(trackReporting(() => pay.reportRefundReleased(token, active, {
          result: failed ? 'failed' : 'cancelled',
          errorMessage: failed ? `프론트 결제 취소 실패(${result.type})` : undefined,
        })), AFTER_NATIVE_WAIT_MS, 'pending')
        if (released === 'auth') toastTokenProblem()
        // '중단했습니다'는 시스템이 일부러 멈춘 것처럼 읽혔다. 실제로는 손님이 취소창을 닫았거나 시간이 지난 것이다.
        showRefundStopped(item, failed ? '결제 취소에 실패했어요' : '결제 취소가 중단됐어요')
      }

      // 결제 취소가 중단·실패했을 때의 화면. 서버는 중단·실패 보고를 받으면 주문을 결제 완료(paid)로 되돌리므로 이 프론트가 같은
      // 취소를 다시 시작할 수 없다 -- 예전의 [다시 시도하기]는 항상 '취소할 수 없는 주문입니다'로 실패했다. 다시 취소하려면 직원이
      // 정비 대기열(POS 탭앱)에서 [프론트에서 취소]를 다시 눌러야 하므로 그렇게 안내하고, 버튼 없이 잠시 뒤 대기화면으로 돌아간다.
      function showRefundStopped(item, title) {
        pay.snooze(pay.refundSnoozeKey(item))
        showMessage('error', title, `${cartTitle(item)} · ${pay.formatWon(item.totalAmount)}\n다시 취소하려면 직원에게 말씀해주세요`, 8000)
      }

      // 취소 시작 요청이 시간 초과였거나 시작 직후 오류 복구가 화면을 가져가서 취소창을 못 띄운 건을 되돌린다(releaseInBackground와 같다).
      // attemptId를 실어 보내므로 그 사이 새 시도가 시작됐다면 서버가 409 { stale:true }로 거절하고, 그건 확정 거절이라 이 시도의 기록을 지운다.
      function releaseRefundInBackground(token, record) {
        reportInBackground(() => pay.reportRefundReleased(token, record))
      }

      // 환불(결제 취소)이 끝난 화면. 손님이 결제창을 닫은 화면('결제가 진행되지 않았어요')과 헷갈리지 않게 제목을 나눴다.
      function showRefunded(item) {
        stopLoadWatchdog() // 지난 기록 확인으로 이미 취소된 걸 알게 된 경우(취소창 전)에도 이 화면의 타이머로 돌아간다
        sdk.template.renderResultPage({
          type: 'text',
          text: pay.formatWon(item.totalAmount),
          title: '환불이 완료됐어요',
          description: `${cartTitle(item)} 결제를 취소했어요`,
          timerMs: 5000,
          onTimeout: goHomeWhenIdle,
          localeCode: 'ko',
        })
      }

      init().catch(recoverFromError)
    </script>
  </body>
</html>
