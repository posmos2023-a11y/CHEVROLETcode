<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://static.toss.im/tds/43.9.4/css/tds.min.css" />
    <link rel="stylesheet" type="text/css" href="https://static.toss.im/tps/main.css" />
    <link rel="stylesheet" type="text/css" href="https://static.toss.im/tps/others.css" />
    <script src="https://cdn.tossplace.com/toss-front-sdk/v0/index.js"></script>
    <script src="./sdk.js"></script>
    <script src="./api-config.js"></script>
    <title>접수 - Toss Front Plugin</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // 이 화면(html)은 실제 단말기에서는 토스프론트 로컬 서버(예: 172.30.1.54:9900)에서 서빙되므로
      // fetch를 상대경로로 호출하면 백엔드가 아니라 그 로컬 주소로 요청이 나가버린다.
      // API 주소는 api-config.js에 빌드 시 주입한다. 백엔드가 직접 서빙하는 미리보기는 상대경로를 쓴다.
      //
      // 화면에 보이는 이름은 '접수'다(당일 방문 손님이 차를 맡기는 흐름이라 '예약'은 사실과 다르다). 파일 이름(reservation.html),
      // API 주소(/api/reservations), 서버 필드 이름은 옛 ZIP·전산 연동과 맞추려고 그대로 둔다.
      //
      // 템플릿의 글자 크기(CDN SDK 번들과 공식 문서 예시로 확인): renderSelectPage는 title이 위쪽 작은 줄(17px), subtitle이 큰 제목(28px)
      // 이다. renderInputPage는 반대로 top.title이 큰 제목, top.subtitle이 작은 줄이다. 그래서 선택 화면은 손님이 답할 질문을 subtitle에 둔다.
      const API_BASE = window.CHEVROLET_API_BASE_URL
      const CAR_NUMBER_RE = /^\d{2,3}[가-힣]\d{4}$/
      // 010 다음 자리는 2~9로 시작한다(0100·0101로 시작하는 번호는 없다). 휴대폰 번호 화면은 '010'이 미리 들어가 있고 11자리가 되면 확인
      // 없이 바로 제출되는데, 손님이 010을 한 번 더 누르면 '01001012345'처럼 엉뚱한 번호로 접수됐다(예전 검사식 /^01[0-9]{8,9}$/가
      // 통과시켰다). 이 검사식이 그 경우를 거른다. 10자리 번호(011 등)는 이 화면에서 받을 수 없다(사장님 결정 전까지 직원 안내).
      const PHONE_RE = /^010[2-9]\d{7}$/
      const PHONE_HINT = '010 다음 8자리만 눌러주세요'

      // 서버(server.js)의 SERVICE_TYPES와 키/순서를 맞춰야 한다.
      const SERVICE_TYPES = [
        { value: 'oil', title: '엔진오일 교체' },
        { value: 'inspection', title: '정기점검' },
        { value: 'tire', title: '타이어 교체·펑크수리' },
        { value: 'battery', title: '배터리 교체' },
        { value: 'brake', title: '브레이크 정비' },
        { value: 'etc', title: '기타 수리·상담' },
      ]

      // 결과 화면을 띄워 두는 시간. SDK가 3~10초로 자르는데, 나이 든 손님이 번호를 읽기 전에 5초 만에 닫혀서 가장 긴 10초로 둔다.
      const RESULT_TIMER_MS = 10000

      // 무입력 제한. 손님이 입력·선택 화면에서 그냥 떠나면 다음 손님이 이전 손님의 차량번호가 남은 화면을 보게 되고, 프론트가
      // 대기화면(전산 결제 주문을 받는 화면)으로 돌아가지 못해 결제 주문도 못 받는다. 화면을 새로 그릴 때마다 90초를 처음부터 센다.
      // 접수를 서버에 보내는 동안(submitReservation)과 자체 타이머가 있는 결과 화면에서는 걸지 않는다 -- 요청 도중 화면을 옮기면
      // 접수가 됐는지 손님이 알 수 없다.
      const IDLE_TIMEOUT_MS = 90000
      let idleTimer = null

      function goIdle() {
        location.href = './index.html'
      }

      function armIdleTimer() {
        clearTimeout(idleTimer)
        idleTimer = setTimeout(goIdle, IDLE_TIMEOUT_MS)
      }

      function disarmIdleTimer() {
        clearTimeout(idleTimer)
        idleTimer = null
      }

      // 토스트는 안내일 뿐이다(SDK가 3초 동안 위쪽에 띄운다). 아이콘은 SDK가 그릴 수 있는 'success'·'error'만 넘긴다 -- CDN 번들의
      // ICON_NAME_MAP에 이 둘뿐이고, 다른 값(예: 'info')을 넘기면 아이콘 이름이 없어 화면 전체가 하얗게 멈춘다(2026-10-23 확인).
      // 아이콘 없이 넘기면 글자만 뜬다(공식 문서 예시).
      const TOAST_ICONS = ['success', 'error']
      function toast(options) {
        const { icon, ...rest } = options || {}
        const safe = TOAST_ICONS.includes(icon) ? { ...rest, icon } : rest
        try {
          Promise.resolve(sdk.template.openToast?.(safe)).catch(() => {})
        } catch { /* 안내일 뿐 */ }
      }

      // 차량번호는 띄어쓰기·하이픈을 지운 뒤 검사한다('12가 3456', '12가-3456'도 받는다). 지역명이 붙은 옛 번호판('서울12가3456')은
      // 전산 표기를 확인하기 전까지 받지 않는다(서버 CAR_NUMBER_RE와 같은 규칙).
      function normalizeCarNumber(value) {
        return String(value || '').replace(/[\s-]/g, '')
      }

      function showCarNumberInput() {
        armIdleTimer()
        sdk.template.renderInputPage({
          type: 'text',
          top: {
            title: '차량번호를 입력해주세요',
            subtitle: '예) 12가3456',
          },
          input: {
            placeholder: '차량번호 입력',
            maxLength: 12, // 띄어쓰기·하이픈을 넣어도 끝자리까지 들어가게(검사 전에 지운다)
          },
          button: { label: '다음' },
          onSubmit: async (value) => {
            const carNumber = normalizeCarNumber(value)
            if (!CAR_NUMBER_RE.test(carNumber)) {
              // 화면을 다시 그리지 않는다 -- 다시 그리면 손님이 넣은 글자가 지워져 처음부터 다시 쳐야 했다(렌더링으로 확인).
              // 입력칸은 그대로 두고 경고 토스트만 띄운다.
              armIdleTimer()
              toast({ message: '차량번호를 다시 확인해주세요. 예) 12가3456', icon: 'error' })
              return
            }
            showServiceTypeSelect(carNumber)
          },
          onBack: goIdle,
        })
      }

      function showServiceTypeSelect(carNumber) {
        armIdleTimer()
        sdk.template.renderSelectPage({
          title: '차량번호 ' + carNumber,
          subtitle: '어떤 정비가 필요하세요?',
          options: SERVICE_TYPES.map((service) => ({
            title: service.title,
            onClick: () => showConsent(carNumber, service.value),
          })),
          onBack: () => {
            showCarNumberInput()
          },
        })
      }

      // 고지 문구는 개인정보보호법 제15조제2항이 요구하는 4가지(수집 항목 / 수집·이용 목적 /
      // 보유·이용 기간 / 동의 거부 권리와 그에 따른 불이익)를 모두 담았다.
      //
      // ⚠️ 보유기간 '3년'은 서버의 DATA_RETENTION_DAYS(기본 1095일)와 같은 값이어야 한다.
      //    한쪽만 바꾸면 손님에게 말한 기간과 실제 파기 시점이 어긋난다.
      //
      // TODO(법무 검토): 보유기간 3년의 근거(정비업에 별도 기록 보관 의무가 있으면 그 기간과
      // 나눠서 관리해야 한다)와 회사명·연락처·구체적인
      // 보유기간은 임의로 채우지 않았다(개인정보보호법 제15조, 정보통신망법 제50조 대응).
      // TODO(법무 검토·동의 문구 버전): 고지의 '목적: 예약·…'은 화면의 다른 곳처럼 '접수'로 바꿀 대상이지만, 법정 고지 문구라
      // 법무 확인과 동의 문구 버전 기록(consentVersion)이 들어간 뒤에 바꾼다. 선택지 문구도 같은 이유로 그대로 둔다.
      //
      // 차량번호·전화번호를 실제로 입력받기 직전에 반드시 이 동의 화면을 거치게 한다. 필수
      // (개인정보 수집·이용) 동의와 선택(광고성 정보 수신) 동의를 분리해서, 광고 수신을 거부해도
      // 접수 자체는 그대로 진행되도록 한다.
      //
      // "동의하지 않음"을 고르면 접수를 진행할 수 없다(개인정보 없이는 접수·순서 안내가 불가능하다).
      // 예전에는 이때 정비 항목 선택 화면으로 되돌렸는데, 손님이 같은 화면을 맴돌며 "왜 안 되지"
      // 하고 멈춘 것처럼 느꼈다(실제 "안 넘어간다" 문의로 확인). 게다가 select 화면의 onClick에서 또
      // select 화면을 그리는 흐름이라 SDK 렌더가 꼬일 여지도 있었다. 그래서 결제 화면(showDeclinedResult)
      // 과 동일하게, 왜 멈추는지 안내하는 결과 화면을 띄우고 대기화면으로 깔끔하게 빠져나간다.
      //
      // 손님이 서서 읽는 화면이라 짧게 줄였다(4가지 고지 항목은 한 줄씩 그대로 담는다). 템플릿은 정렬을
      // 바꿀 수 없어서(토스 Template API만 허용) 줄 길이를 비슷하게 맞춰 한쪽으로 쏠려 보이지 않게 한다.
      // 목적에 "정비 완료·결제 안내"를 넣었다 -- [완료] 안내 문자와 결제 영수증을 이 번호로 보낸다.
      // 예전엔 고지 3줄이 큰 제목(subtitle, 28px)으로 나오고 질문이 작은 줄이었다. 질문을 큰 제목으로, 고지를 작은 줄로 맞바꿨다.
      function showConsent(carNumber, serviceType) {
        armIdleTimer()
        sdk.template.renderSelectPage({
          title:
            '수집: 차량번호·전화번호·정비 항목\n' +
            '목적: 예약·순서·정비 완료·결제 안내, 정비 이력 관리\n' +
            '보관: 3년 후 파기 · 거부하셔도 직원 안내로 정비받을 수 있어요',
          subtitle: '순서 알림을 받으시려면\n동의가 필요해요',
          options: [
            {
              title: '동의하고 계속',
              subtitle: '필수 항목만',
              onClick: () => showPhoneInput(carNumber, serviceType, { privacyConsent: true, marketingConsent: false }),
            },
            {
              title: '홍보 문자 수신까지 동의',
              subtitle: '선택 · 할인·이벤트 소식(광고성 정보)',
              onClick: () => showPhoneInput(carNumber, serviceType, { privacyConsent: true, marketingConsent: true }),
            },
            {
              title: '동의하지 않음',
              onClick: () => showConsentDeclined(),
            },
          ],
          onBack: goIdle,
        })
      }

      // 동의를 거부해도 손님을 밀어내지 않는다. 이 키오스크 접수는 "순서 알림"을 위한 편의 기능일
      // 뿐이고, 손님은 매장 직원에게 직접 말해도 얼마든지 정비를 받을 수 있다. 그래서 "진행 불가" 같은
      // 부정적 문구 대신, 정비는 받을 수 있음을 안내하고 직원 문의로 이어준다(사장님 방침: 동의 안 해도
      // 점검은 받을 수 있게). text 칸은 56px 글씨라 짧게 둔다.
      function showConsentDeclined() {
        disarmIdleTimer() // 이 화면은 자체 타이머로 대기화면에 돌아간다 -- 앞 화면의 무입력 타이머가 남아 끼어들지 않게 끈다
        sdk.template.renderResultPage({
          type: 'text',
          text: '직원 안내',
          title: '동의 없이도 정비받을 수 있어요',
          description: '카운터 직원에게\n말씀해주세요',
          buttons: [{ label: '확인', onClick: goIdle }],
          timerMs: RESULT_TIMER_MS,
          onTimeout: goIdle,
          localeCode: 'ko',
        })
      }

      // idempotencyKey 기본값(crypto.randomUUID())은 "이 접수 시도"가 시작되는 첫 진입(showConsent →
      // showPhoneInput, 인자 없이 호출)에서만 새로 만들어진다. 전화번호 형식 오류로 이 함수가 자기
      // 자신을 다시 부를 때는 기존 idempotencyKey를 그대로 넘기므로 새로 만들어지지
      // 않는다 — 아직 서버에 아무것도 보내지 않은 단계라 새로 만들어도 위험하진 않지만, 어차피 같은
      // 접수 시도이므로 굳이 바꿀 이유가 없다. 진짜 위험한 지점은 submitReservation의 catch였다
      // (아래 showNetworkErrorRetry 주석 참고) — 거기서 새 키를 만들면서 재접수가 새 접수로 처리됐다.
      //
      // phone 타입은 SDK가 '010'을 미리 넣어 두고 11자리가 되면 바로 제출한다. 버튼은 그리지 않는다(문서의 PhoneInputPage에 button이
      // 없다). 그래서 작은 줄에 '010 다음 8자리만'을 늘 보여 준다. 형식이 틀리면 화면을 다시 그려 '010'부터 다시 누르게 한다(같은 키).
      function showPhoneInput(carNumber, serviceType, consent, hint, idempotencyKey = crypto.randomUUID()) {
        armIdleTimer()
        sdk.template.renderInputPage({
          type: 'phone',
          top: {
            title: '순서 안내를 받을\n휴대폰 번호를 입력해주세요',
            subtitle: hint || PHONE_HINT,
          },
          input: { placeholder: '휴대폰 번호 입력' },
          onSubmit: async (value) => {
            const phone = String(value || '').replace(/\D/g, '')
            if (!PHONE_RE.test(phone)) {
              let message = '휴대폰 번호를 다시 확인해주세요'
              let nextHint = PHONE_HINT
              if (/^0100/.test(phone)) {
                // 미리 들어간 010 뒤에 010을 또 눌렀다('010' + '010…' = '0100…')
                message = '010을 두 번 누르셨어요'
                nextHint = '010 다음 8자리만 다시 눌러주세요'
              } else if (/^01[1-9]/.test(phone)) {
                message = '010 번호만 받을 수 있어요'
                nextHint = '다른 번호는 직원에게 말씀해주세요'
              }
              toast({ message, icon: 'error' })
              showPhoneInput(carNumber, serviceType, consent, nextHint, idempotencyKey)
              return
            }
            await submitReservation(carNumber, phone, serviceType, consent, idempotencyKey)
          },
          onBack: () => {
            showConsent(carNumber, serviceType)
          },
        })
      }

      // failures: 응답을 못 받은(또는 5xx) 연속 횟수. 두 번째 실패부터 [처음부터 새로 접수]를 보인다(showNetworkErrorRetry).
      async function submitReservation(carNumber, phone, serviceType, consent, idempotencyKey, failures = 0) {
        disarmIdleTimer() // 서버에 보내는 동안은 걸지 않는다. 결과·오류 화면은 자체 타이머가 있고, 다시 입력 화면을 그리면 다시 건다
        let res
        let json
        try {
          // App API(https://docs.tossplace.com/reference/plugin-sdk/front/app.html)의 비동기 함수.
          // 실제 단말기에서는 토스프론트가 그 단말기에 온보딩된 실제 가맹점 정보를 반환하고,
          // 로컬 브라우저 미리보기에서는 sdk.js가 채워둔 테스트 매장 정보가 반환된다.
          const merchant = await sdk.app.getMerchant()
          const merchantId = merchant?.id
          // privacyConsent/marketingConsent는 showConsent 화면에서 손님이 실제로 고른 값을 그대로
          // 전달한다 — 서버가 privacyConsent !== true면 400으로 거부하므로 여기서 하드코딩하면 안 된다.
          res = await fetch(`${API_BASE}/api/reservations`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Idempotency-Key': idempotencyKey },
            body: JSON.stringify({
              carNumber,
              phone,
              serviceType,
              merchantId,
              privacyConsent: consent.privacyConsent,
              marketingConsent: consent.marketingConsent,
            }),
          })
          json = await res.json().catch(() => ({}))
        } catch (err) {
          // fetch 자체가 실패해 응답을 못 받았다 — 서버는 이미 처리를 끝냈을 수 있다(대기번호
          // 발급 + 접수 알림 발송까지 나간 뒤 응답만 못 받은 경우). 예전에는 여기서
          // showCarNumberInput()으로 처음부터 다시 시작했는데, 그러면 showPhoneInput의 기본 인자가
          // crypto.randomUUID()로 새 Idempotency-Key를 발급해버려서 재접수가 "새 접수"로 처리되고
          // 대기번호가 두 개 발급됐다(실제 장애). 그래서 여기서는 입력값과 키를 그대로 들고 있는
          // showNetworkErrorRetry로 보낸다 — 손님이 다시 접수를 원하면 같은 키로 재시도하고, 정말
          // 처음부터 새로 넣고 싶을 때만 명시적으로 그걸 선택하게 한다.
          showNetworkErrorRetry(carNumber, phone, serviceType, consent, idempotencyKey, failures + 1)
          return
        }
        const retry = () => submitReservation(carNumber, phone, serviceType, consent, idempotencyKey)

        if (res.status === 429) {
          // 접수 한도(매장·전화번호 기준)에 걸렸다. 예전엔 3초 오류 화면 뒤 처음 화면으로 돌아가 손님이 모든 걸 다시 입력해야 했다.
          // 입력값과 키를 그대로 들고 [다시 시도]를 준다(같은 키라 그 사이 접수가 됐어도 같은 번호가 돌아온다).
          showRateLimited(json.retryAfterSec, retry)
          return
        }
        if (res.status >= 500) {
          // 서버·게이트웨이 오류는 처리가 됐는지 알 수 없다(게이트웨이 시간 초과는 서버가 접수를 끝냈을 수도 있다). 응답을 못 받은
          // 경우와 같이 같은 키로 다시 시도하게 한다.
          showNetworkErrorRetry(carNumber, phone, serviceType, consent, idempotencyKey, failures + 1)
          return
        }
        if (!res.ok || !json.ok) {
          // 서버가 분명히 거절했다(매장 미등록·형식 오류 등) — 같은 입력을 다시 보내도 똑같이 막힐 사유들이다.
          // 서버 문구(json.error)는 직원이 원인을 알 수 있게 아래 줄에 작게 둔다. image 타입은 줄을 자동으로 바꾸지 않아 직접 나눈다.
          sdk.template.renderResultPage({
            type: 'image',
            status: 'error',
            title: '접수하지 못했어요',
            description: `직원에게 말씀해주세요${json.error ? `\n(${json.error})` : ''}`,
            buttons: [{ label: '처음부터 다시 접수', onClick: () => showCarNumberInput() }],
            timerMs: RESULT_TIMER_MS,
            onTimeout: goIdle,
            localeCode: 'ko',
          })
          return
        }

        showAccepted(json)
      }

      // 접수 완료 화면. 큰 글씨(text)는 대기번호, 작은 줄(title)은 결과, description(28px)은 앞에 기다리는 차와 다음 일이다.
      // duplicate: true는 서버가 새 번호를 주지 않고 기존 접수를 돌려준 것이다 — 이 Idempotency-Key로 이미 만들어져 있던 접수
      // (네트워크 오류 뒤 같은 키로 재시도, "다시 시도" 연타)이거나, 같은 차가 **같은 휴대폰 번호로** 오늘 이미 대기 중인 경우다. "접수했어요"라고만 하면
      // 손님이 "어, 방금 접수했는데 또?"라고 헷갈릴 수 있어 문구를 구분한다. queueNumber는 최초 접수 때 발급된 값 그대로다.
      // 서버는 번호가 다르면 duplicate로 묶지 않고 새 접수를 만든다(번호를 고쳐 다시 접수한 손님의 알림이 옛 번호로 가지 않게). 그래서
      // duplicate여도 '휴대폰으로 알려드려요'는 손님이 방금 넣은 번호 그대로라 맞다. 서버가 이 약속을 바꾸면 이 문구도 같이 바꿔야 한다.
      // peopleAhead는 이 차 앞에 기다리는(waiting) 차 수다. 옛 서버처럼 값이 없으면 그 줄을 뺀다.
      // 순서 안내는 알림톡 템플릿이 승인되기 전까지 문자로 나가므로 '휴대폰으로 알려드려요'라고 쓴다.
      function showAccepted(json) {
        const hasAhead = json.peopleAhead !== null && json.peopleAhead !== undefined && Number.isFinite(Number(json.peopleAhead))
        const ahead = hasAhead ? Math.max(0, Math.floor(Number(json.peopleAhead))) : 0
        const alreadyCalled = json.duplicate && (json.status === 'called' || json.status === 'notify_failed')
        let description
        if (alreadyCalled) {
          description = '이미 순서가 됐어요\n직원에게 말씀해주세요'
        } else {
          const aheadLine = !hasAhead ? '' : ahead > 0 ? `앞에 ${ahead}대 기다리고 있어요\n` : '앞에 기다리는 차가 없어요\n'
          description = `${aheadLine}순서가 되면 휴대폰으로 알려드려요`
        }
        sdk.template.renderResultPage({
          type: 'text',
          text: `${json.queueNumber}번`,
          title: json.duplicate ? '이미 접수되어 있어요' : '접수했어요',
          description,
          buttons: [{ label: '확인', onClick: goIdle }],
          timerMs: RESULT_TIMER_MS,
          onTimeout: goIdle,
          localeCode: 'ko',
        })
      }

      // 접수 한도에 걸렸을 때(429). 서버가 body.retryAfterSec(초)를 주면 그 전에 누른 [다시 시도]는 서버에 보내지 않고 기다리라고만
      // 안내한다(같은 한도에 또 걸려 기다리는 시간만 늘어난다). 오래 기다려야 하면(1분 넘게) 직원에게 안내하라고 한다 -- 같은
      // 번호로 접수가 반복된 경우라 손님이 기다려서 풀 일이 아니다. 뒤로가기도 데이터를 잃지 않게 [다시 시도]와 같다.
      //
      // ⚠️ SDK는 뒤로가기(onBack)를 부르기 **전에** 화면을 지운다(renderSelectPage가 unmount한 뒤 onBack을 부른다 -- CDN 번들로 확인).
      // 예전엔 뒤로가기가 [다시 시도]와 같은 함수라, 기다릴 시간이 남았으면 토스트만 띄우고 끝났다. 화면이 없으니 토스트도 뜨지 않고
      // 흰 화면이 90초 무입력 타이머까지 남았다(그동안 전산 결제 주문도 받지 못한다). 그래서 뒤로가기는 어느 갈래든 이 화면을 먼저 다시 그린다.
      function showRateLimited(retryAfterSec, retry) {
        const waitSec = Number(retryAfterSec)
        const retryAt = Number.isFinite(waitSec) && waitSec > 0 ? Date.now() + waitSec * 1000 : 0
        let sent = false
        const leftSec = () => Math.ceil((retryAt - Date.now()) / 1000)
        const waitToast = (left) => toast({ message: `${left}초 뒤에 다시 눌러주세요`, icon: 'error' })
        const send = () => {
          sent = true
          retry()
        }
        const onRetry = () => {
          if (sent) return
          const left = leftSec()
          if (left > 0) {
            armIdleTimer()
            waitToast(left)
            return
          }
          send()
        }
        const onBack = () => {
          if (sent) {
            // 이미 보내는 중이다: 같은 화면만 다시 그려 두고 응답을 기다린다(버튼은 sent라 무시된다). 무입력 타이머는 걸지 않는다 --
            // 요청 도중 화면을 옮기면 접수가 됐는지 손님이 알 수 없다(submitReservation).
            draw(false)
            return
          }
          draw(true)
          const left = leftSec()
          if (left > 0) {
            waitToast(left) // 토스트는 화면을 다시 그린 다음에 띄운다(화면이 없으면 그려지지 않는다)
            return
          }
          send() // 보내는 동안에도 이 화면이 남는다(submitReservation이 무입력 타이머를 끈다)
        }
        const draw = (arm) => {
          if (arm) armIdleTimer()
          sdk.template.renderSelectPage({
            title: '접수 요청이 잠시 많아요',
            subtitle: Number.isFinite(waitSec) && waitSec > 60
              ? '직원에게 말씀해주세요'
              : '잠시 후 [다시 시도]를\n눌러주세요',
            options: [
              { title: '다시 시도', subtitle: '입력한 내용 그대로 접수해요', onClick: onRetry },
              { title: '처음으로', onClick: goIdle },
            ],
            onBack,
          })
        }
        draw(true)
      }

      // 응답을 못 받았을 때(네트워크 오류·5xx)만 거치는 화면.
      //
      // renderResultPage의 timerMs로 자동 재시도를 거는 방법도 검토했다(다른 오류 화면들이 쓰는
      // 패턴). 하지만 서버가 정말 오프라인이면 화면이 말없이 몇 초마다 계속 재시도만 반복하게 되고,
      // 재시도를 몇 번까지 자동으로 할지(3번? 5번?)를 임의로 정해야 하며, 그 횟수를 다 채우고 나면
      // 결국 어딘가로는 빠져나가야 하는데 그게 showCarNumberInput()이면 바로 이 커밋이 고치려는
      // 문제(새 키 발급)가 그대로 재발한다. 그래서 자동 재시도 대신 select 화면으로 명시적인
      // 선택지를 준다 — "다시 시도"는 같은 idempotencyKey를 그대로 재사용해 몇 번을 눌러도 서버가
      // 중복을 걸러주고, "처음부터 새로 접수"를 고를 때만 새 키가 발급되는 흐름(showCarNumberInput)
      // 으로 넘어간다. 뒤로가기(onBack)도 데이터를 잃지 않도록 "다시 시도"와 동일하게 처리한다.
      // 예전 문구는 '서버까지 도달', '응답' 같은 개발 용어라 손님이 무엇을 눌러야 할지 몰랐다. 첫 실패에는 [다시 시도]만 보이고,
      // 두 번째 실패부터 [처음부터 새로 접수]를 보인다(새로 접수하면 번호가 두 개 생길 수 있다).
      // 뒤로가기는 showRateLimited와 같은 이유(SDK가 onBack 전에 화면을 지운다)로 이 화면을 먼저 다시 그린다. 예전엔 [다시 시도]를 누른 뒤
      // 응답을 기다리는 중에 뒤로가기를 누르면 picked 때문에 아무것도 그리지 않아, 응답이 올 때까지(시간 제한 없음) 흰 화면이었다.
      function showNetworkErrorRetry(carNumber, phone, serviceType, consent, idempotencyKey, failures = 1) {
        let picked = false
        const retry = () => {
          if (picked) return
          picked = true
          submitReservation(carNumber, phone, serviceType, consent, idempotencyKey, failures)
        }
        const options = [{ title: '다시 시도', subtitle: '이미 접수됐다면 같은 번호를 알려드려요', onClick: retry }]
        if (failures >= 2) {
          options.push({
            title: '처음부터 새로 접수',
            onClick: () => {
              if (picked) return
              picked = true
              showCarNumberInput()
            },
          })
        }
        const onBack = () => {
          if (picked) {
            draw(false) // 이미 보내는 중: 같은 화면만 다시 그려 두고 응답을 기다린다(무입력 타이머는 걸지 않는다)
            return
          }
          draw(true)
          retry() // 보내는 동안에도 이 화면이 남는다
        }
        const draw = (arm) => {
          if (arm) armIdleTimer() // 선택 화면이라 손님이 떠나면 그대로 남는다
          sdk.template.renderSelectPage({
            title: '접수 결과를 확인하지 못했어요',
            subtitle: failures >= 2 ? '그래도 안 되면\n직원에게 말씀해주세요' : '아래 [다시 시도]를\n눌러주세요',
            options,
            onBack,
          })
        }
        draw(true)
      }

      showCarNumberInput()
    </script>
  </body>
</html>
