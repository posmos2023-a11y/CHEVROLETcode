<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://static.toss.im/tds/43.9.4/css/tds.min.css" />
    <link rel="stylesheet" type="text/css" href="https://static.toss.im/tps/main.css" />
    <link rel="stylesheet" type="text/css" href="https://static.toss.im/tps/others.css" />
    <script src="https://cdn.tossplace.com/toss-front-sdk/v0/index.js"></script>
    <script src="./sdk.js"></script>
    <script src="./api-config.js"></script>
    <title>예약 - Toss Front Plugin</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // 이 화면(html)은 실제 단말기에서는 토스프론트 로컬 서버(예: 172.30.1.54:9900)에서 서빙되므로
      // fetch를 상대경로로 호출하면 백엔드가 아니라 그 로컬 주소로 요청이 나가버린다.
      // API 주소는 api-config.js에 빌드 시 주입한다. 백엔드가 직접 서빙하는 미리보기는 상대경로를 쓴다.
      const API_BASE = window.CHEVROLET_API_BASE_URL
      const CAR_NUMBER_RE = /^\d{2,3}[가-힣]\d{4}$/
      const PHONE_RE = /^01[0-9]{8,9}$/

      // 서버(server.js)의 SERVICE_TYPES와 키/순서를 맞춰야 한다.
      const SERVICE_TYPES = [
        { value: 'oil', title: '엔진오일 교체' },
        { value: 'inspection', title: '정기점검' },
        { value: 'tire', title: '타이어 교체·펑크수리' },
        { value: 'battery', title: '배터리 교체' },
        { value: 'brake', title: '브레이크 정비' },
        { value: 'etc', title: '기타 수리·상담' },
      ]

      function showCarNumberInput(errorText) {
        sdk.template.renderInputPage({
          type: 'text',
          top: {
            title: '차량번호를 입력해주세요',
            subtitle: errorText || '예) 12가3456',
          },
          input: {
            placeholder: '12가3456',
            maxLength: 8,
          },
          button: { label: '다음' },
          onSubmit: async (value) => {
            const carNumber = value.trim()
            if (!CAR_NUMBER_RE.test(carNumber)) {
              showCarNumberInput('차량번호 형식이 올바르지 않습니다. 예) 12가3456')
              return
            }
            showServiceTypeSelect(carNumber)
          },
          onBack: () => {
            location.href = './index.html'
          },
        })
      }

      function showServiceTypeSelect(carNumber) {
        sdk.template.renderSelectPage({
          title: '어떤 정비가 필요하신가요?',
          subtitle: '차량번호 ' + carNumber,
          options: SERVICE_TYPES.map((service) => ({
            title: service.title,
            onClick: () => showConsent(carNumber, service.value),
          })),
          onBack: () => {
            showCarNumberInput()
          },
        })
      }

      // 고지 문구는 개인정보보호법 제15조제2항이 요구하는 4가지(수집 항목 / 수집·이용 목적 /
      // 보유·이용 기간 / 동의 거부 권리와 그에 따른 불이익)를 모두 담았다.
      //
      // ⚠️ 보유기간 '3년'은 서버의 DATA_RETENTION_DAYS(기본 1095일)와 같은 값이어야 한다.
      //    한쪽만 바꾸면 손님에게 말한 기간과 실제 파기 시점이 어긋난다.
      //
      // TODO(법무 검토): 보유기간 3년의 근거(정비업에 별도 기록 보관 의무가 있으면 그 기간과
      // 나눠서 관리해야 한다)와 회사명·연락처·구체적인
      // 보유기간은 임의로 채우지 않았다(개인정보보호법 제15조, 정보통신망법 제50조 대응).
      //
      // 차량번호·전화번호를 실제로 입력받기 직전에 반드시 이 동의 화면을 거치게 한다. 필수
      // (개인정보 수집·이용) 동의와 선택(광고성 정보 수신) 동의를 분리해서, 광고 수신을 거부해도
      // 예약 접수 자체는 그대로 진행되도록 한다.
      //
      // "동의하지 않음"을 고르면 예약을 진행할 수 없다(개인정보 없이는 접수·순서 안내가 불가능하다).
      // 예전에는 이때 정비 항목 선택 화면으로 되돌렸는데, 손님이 같은 화면을 맴돌며 "왜 예약이 안 되지"
      // 하고 멈춘 것처럼 느꼈다(실제 "안 넘어간다" 문의로 확인). 게다가 select 화면의 onClick에서 또
      // select 화면을 그리는 흐름이라 SDK 렌더가 꼬일 여지도 있었다. 그래서 결제 화면(showDeclinedResult)
      // 과 동일하게, 왜 멈추는지 안내하는 결과 화면을 띄우고 대기화면으로 깔끔하게 빠져나간다.
      function showConsent(carNumber, serviceType) {
        sdk.template.renderSelectPage({
          title: '순서 안내를 위해 동의가 필요합니다',
          subtitle:
            '수집 항목: 차량번호, 전화번호, 정비 항목\n' +
            '수집 목적: 예약 접수와 순서 안내(알림톡), 정비 이력 관리\n' +
            '보유 기간: 수집일로부터 3년, 이후 지체 없이 파기\n' +
            '동의를 거부하실 수 있으나, 거부하시면 예약 접수와 순서 안내를 해드릴 수 없습니다.\n' +
            '광고성 정보 수신은 선택이며, 거부하셔도 예약·순서 안내에는 제한이 없습니다.',
          options: [
            {
              title: '필수 항목에만 동의하고 계속',
              onClick: () => showPhoneInput(carNumber, serviceType, { privacyConsent: true, marketingConsent: false }),
            },
            {
              title: '필수 + 광고성 정보 수신에 모두 동의',
              onClick: () => showPhoneInput(carNumber, serviceType, { privacyConsent: true, marketingConsent: true }),
            },
            {
              title: '동의하지 않음',
              onClick: () => showConsentDeclined(),
            },
          ],
          onBack: () => {
            location.href = './index.html'
          },
        })
      }

      // 동의를 거부해도 손님을 밀어내지 않는다. 이 키오스크 예약은 "순서 알림톡"을 위한 편의 기능일
      // 뿐이고, 손님은 매장 직원에게 직접 말해도 얼마든지 정비를 받을 수 있다. 그래서 "진행 불가" 같은
      // 부정적 문구 대신, 정비는 받을 수 있음을 안내하고 직원 문의로 이어준다(사장님 방침: 동의 안 해도
      // 점검은 받을 수 있게).
      function showConsentDeclined() {
        sdk.template.renderResultPage({
          type: 'text',
          text: '직원에게 문의해주세요',
          title: '동의 없이도 정비는 받으실 수 있어요',
          description: '예약 순서를 알림톡으로 안내받으시려면 동의가 필요해요. 동의를 원하지 않으시면 매장 직원에게 말씀해주시면 도와드리겠습니다.',
          timerMs: 6000,
          onTimeout: () => {
            location.href = './index.html'
          },
          localeCode: 'ko',
        })
      }

      // idempotencyKey 기본값(crypto.randomUUID())은 "이 접수 시도"가 시작되는 첫 진입(showConsent →
      // showPhoneInput, 인자 없이 호출)에서만 새로 만들어진다. 전화번호 형식 오류로 이 함수가 자기
      // 자신을 다시 부를 때는 152번째 줄에서 기존 idempotencyKey를 그대로 넘기므로 새로 만들어지지
      // 않는다 — 아직 서버에 아무것도 보내지 않은 단계라 새로 만들어도 위험하진 않지만, 어차피 같은
      // 접수 시도이므로 굳이 바꿀 이유가 없다. 진짜 위험한 지점은 submitReservation의 catch였다
      // (아래 showNetworkErrorRetry 주석 참고) — 거기서 새 키를 만들면서 재접수가 새 예약으로 처리됐다.
      function showPhoneInput(carNumber, serviceType, consent, errorText, idempotencyKey = crypto.randomUUID()) {
        sdk.template.renderInputPage({
          type: 'phone',
          top: {
            title: '전화번호를 입력해주세요',
            subtitle: errorText || '순서가 되면 알림톡으로 안내드려요',
          },
          input: { placeholder: '전화번호 입력' },
          button: { label: '예약 완료' },
          onSubmit: async (value) => {
            const phone = value.replace(/-/g, '').trim()
            if (!PHONE_RE.test(phone)) {
              showPhoneInput(carNumber, serviceType, consent, '전화번호 형식이 올바르지 않습니다.', idempotencyKey)
              return
            }
            await submitReservation(carNumber, phone, serviceType, consent, idempotencyKey)
          },
          onBack: () => {
            showConsent(carNumber, serviceType)
          },
        })
      }

      async function submitReservation(carNumber, phone, serviceType, consent, idempotencyKey) {
        try {
          // App API(https://docs.tossplace.com/reference/plugin-sdk/front/app.html)의 비동기 함수.
          // 실제 단말기에서는 토스프론트가 그 단말기에 온보딩된 실제 가맹점 정보를 반환하고,
          // 로컬 브라우저 미리보기에서는 sdk.js가 채워둔 테스트 매장 정보가 반환된다.
          const merchant = await sdk.app.getMerchant()
          const merchantId = merchant?.id
          // privacyConsent/marketingConsent는 showConsent 화면에서 손님이 실제로 고른 값을 그대로
          // 전달한다 — 서버가 privacyConsent !== true면 400으로 거부하므로 여기서 하드코딩하면 안 된다.
          const res = await fetch(`${API_BASE}/api/reservations`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Idempotency-Key': idempotencyKey },
            body: JSON.stringify({
              carNumber,
              phone,
              serviceType,
              merchantId,
              privacyConsent: consent.privacyConsent,
              marketingConsent: consent.marketingConsent,
            }),
          })
          const json = await res.json().catch(() => ({}))

          if (!res.ok || !json.ok) {
            // 서버가 응답을 했다는 것은 요청이 네트워크를 왕복했다는 뜻이다 — 형식 오류·매장
            // 미등록처럼 같은 입력을 다시 보내도 똑같이 막힐 사유들이라 처음부터 다시 입력하게
            // 한다. 응답 자체를 못 받은 경우(아래 catch)와는 성격이 달라서 구분해야 한다.
            sdk.template.renderResultPage({
              type: 'image',
              status: 'error',
              title: json.error || '예약 접수 중 오류가 발생했습니다.',
              timerMs: 3000,
              onTimeout: () => showCarNumberInput(),
              localeCode: 'ko',
            })
            return
          }

          // duplicate: true는 서버(backend/src/store.js의 createReservation)가 이 Idempotency-Key로
          // 이미 만들어져 있던 예약을 그대로 돌려준 것이다 — 방금 새로 접수된 게 아니라, 네트워크
          // 오류로 응답을 못 받고 같은 키로 재시도했거나(아래 catch → showNetworkErrorRetry) 손님이
          // "다시 시도"를 여러 번 눌렀을 때 나온다. "접수되었습니다"라고만 하면 손님이 "어, 방금
          // 접수했는데 또?"라고 헷갈릴 수 있어 문구를 구분한다. queueNumber는 최초 접수 때 발급된
          // 값 그대로다(서버가 새로 채번하지 않는다).
          sdk.template.renderResultPage({
            type: 'text',
            text: `${json.queueNumber}번`,
            title: json.duplicate ? '이미 접수되어 있어요' : '예약이 접수되었습니다',
            description: `${json.serviceType || ''} · 순서가 되면 알림톡으로 안내드려요`,
            timerMs: 5000,
            onTimeout: () => {
              location.href = './index.html'
            },
            localeCode: 'ko',
          })
        } catch (err) {
          // fetch 자체가 실패해 응답을 못 받았다 — 서버는 이미 처리를 끝냈을 수 있다(대기번호
          // 발급 + 접수 알림톡 발송까지 나간 뒤 응답만 못 받은 경우). 예전에는 여기서
          // showCarNumberInput()으로 처음부터 다시 시작했는데, 그러면 showPhoneInput의 기본 인자가
          // crypto.randomUUID()로 새 Idempotency-Key를 발급해버려서 재접수가 "새 예약"으로 처리되고
          // 대기번호가 두 개 발급됐다(실제 장애). 그래서 여기서는 입력값과 키를 그대로 들고 있는
          // showNetworkErrorRetry로 보낸다 — 손님이 다시 접수를 원하면 같은 키로 재시도하고, 정말
          // 처음부터 새로 넣고 싶을 때만 명시적으로 그걸 선택하게 한다.
          showNetworkErrorRetry(carNumber, phone, serviceType, consent, idempotencyKey)
        }
      }

      // 네트워크 오류로 서버 응답을 못 받았을 때만 거치는 화면.
      //
      // renderResultPage의 timerMs로 자동 재시도를 거는 방법도 검토했다(다른 오류 화면들이 쓰는
      // 패턴). 하지만 서버가 정말 오프라인이면 화면이 말없이 몇 초마다 계속 재시도만 반복하게 되고,
      // 재시도를 몇 번까지 자동으로 할지(3번? 5번?)를 임의로 정해야 하며, 그 횟수를 다 채우고 나면
      // 결국 어딘가로는 빠져나가야 하는데 그게 showCarNumberInput()이면 바로 이 커밋이 고치려는
      // 문제(새 키 발급)가 그대로 재발한다. 그래서 자동 재시도 대신 select 화면으로 명시적인
      // 선택지를 준다 — "다시 시도"는 같은 idempotencyKey를 그대로 재사용해 몇 번을 눌러도 서버가
      // 중복을 걸러주고, "처음부터 새로 접수"를 고를 때만 새 키가 발급되는 흐름(showCarNumberInput)
      // 으로 넘어간다. 뒤로가기(onBack)도 데이터를 잃지 않도록 "다시 시도"와 동일하게 처리한다.
      function showNetworkErrorRetry(carNumber, phone, serviceType, consent, idempotencyKey) {
        sdk.template.renderSelectPage({
          title: '네트워크 오류가 발생했습니다',
          subtitle:
            '접수 요청이 서버까지 도달했지만 응답만 못 받았을 수도 있어요.\n' +
            '처음부터 다시 넣으면 예약이 중복으로 접수될 수 있으니 먼저 다시 시도해주세요.',
          options: [
            {
              title: '다시 시도',
              onClick: () => submitReservation(carNumber, phone, serviceType, consent, idempotencyKey),
            },
            {
              title: '처음부터 새로 접수',
              onClick: () => showCarNumberInput(),
            },
          ],
          onBack: () => submitReservation(carNumber, phone, serviceType, consent, idempotencyKey),
        })
      }

      showCarNumberInput()
    </script>
  </body>
</html>
